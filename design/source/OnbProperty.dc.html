<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Keystona OnbProperty</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.m{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;border:0;background:none;padding:0;margin:0;cursor:pointer;text-align:left}
a{color:#071238;text-decoration:none}a:hover{color:#2540D8}
@keyframes kpulse{0%{box-shadow:0 0 0 0 rgba(255,59,98,.5)}70%{box-shadow:0 0 0 6px rgba(255,59,98,0)}100%{box-shadow:0 0 0 0 rgba(255,59,98,0)}}
.pulse{animation:kpulse 1.8s infinite}
input,textarea{font:inherit;color:#071238}
input::placeholder,textarea::placeholder{color:rgba(7,18,56,0.35)}
input:focus,textarea:focus{outline:none}
textarea{resize:none}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; color: #071238; display: flex; flex-direction: column; position: relative; overflow: hidden">
<div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 0; height: 300px; background-image: linear-gradient(rgba(255,59,98,0.12) 1px, transparent 1px), linear-gradient(90deg, rgba(255,59,98,0.12) 1px, transparent 1px); background-size: 22px 22px; background-position: -1px -1px; -webkit-mask-image: linear-gradient(#000 40%, transparent); mask-image: linear-gradient(#000 40%, transparent)"></div>
<div style="position: relative; display: flex; align-items: center; gap: 12px; padding: 14px 16px 0">
<a href="OnbPersona.dc.html" aria-label="Back" style="width: 44px; height: 44px; margin-left: -10px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6l6 6"></path></svg></a>
<div role="progressbar" aria-label="Setup" aria-valuemin="0" aria-valuemax="3" aria-valuenow="2" style="flex: 1; display: flex; gap: 6px"><span style="flex: 1; height: 4px; border-radius: 2px; background: #FF3B62;"></span><span style="flex: 1; height: 4px; border-radius: 2px; background: #FF3B62;"></span><span style="flex: 1; height: 4px; border-radius: 2px; box-shadow: inset 0 0 0 1px rgba(7,18,56,0.2);"></span></div>
<span class="m" style="font-size: 10px; font-weight: 700; letter-spacing: 1px; color: rgba(7,18,56,0.5); min-width: 44px; text-align: right">2 OF 3</span>
</div>
<main style="position: relative; flex: 1; min-height: 0; padding: 18px 20px 24px; display: flex; flex-direction: column; gap: 20px">

<header style="display: flex; flex-direction: column; gap: 8px; padding-top: 8px">
<h1 style="margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -1px; line-height: 1.1">Tell us about your home.</h1>
<p style="margin: 0; font-size: 15px; line-height: 1.5; color: rgba(7,18,56,0.65)">The age and size shape your reminders — a 1998 roof needs different care than a new one.</p>
</header>
<div style="display: flex; flex-direction: column; gap: 6px; position: relative">
<span style="display: flex; align-items: center; gap: 3px; min-height: 13px"><span class="m" style="font-size: 10px; font-weight: 500; letter-spacing: 1.2px; color: rgba(7,18,56,0.55)">ADDRESS</span><span aria-hidden="true" style="color: #FF3B62; font-weight: 700">*</span></span>
<span style="{{addrBox}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="rgba(7,18,56,0.45)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 11m-3 0a3 3 0 1 0 6 0a3 3 0 1 0-6 0"></path><path d="M17.657 16.657l-4.243 4.243a2 2 0 0 1-2.827 0l-4.244-4.243a8 8 0 1 1 11.314 0z"></path></svg><input type="text" value="{{addr}}" onChange="{{onAddr}}" placeholder="Start typing your address" aria-required="true" aria-autocomplete="list" style="flex: 1; min-width: 0; height: 100%; border: 0; background: transparent; font: inherit; font-size: 16px; color: #071238; outline: none"></span>
<sc-if value="{{showSugg}}" hint-placeholder-val="{{ true }}">
<ul role="listbox" style="list-style: none; margin: 4px 0 0; padding: 4px; border-radius: 14px; background: #FFFFFF; box-shadow: 0 10px 30px rgba(7,18,56,0.16), 0 0 0 1px rgba(7,18,56,0.08)">
<sc-for list="{{sugg}}" as="s" hint-placeholder-count="3"><li><button type="button" role="option" onClick="{{s.pick}}" style="width: 100%; display: flex; flex-direction: column; gap: 2px; padding: 10px 12px; border-radius: 10px; text-align: left"><span style="font-size: 15px; font-weight: 600">{{s.a}}</span><span class="m" style="font-size: 10px; font-weight: 500; letter-spacing: 0.3px; line-height: 1.3; color: rgba(7,18,56,0.55)">{{s.c}}</span></button></li></sc-for>
</ul>
</sc-if>
<sc-if value="{{picked}}" hint-placeholder-val="{{ false }}"><span class="m" style="font-size: 10px; font-weight: 500; letter-spacing: 0.3px; line-height: 1.35; color: rgba(7,18,56,0.45)">{{cityLine}}</span></sc-if>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<span class="m" style="font-size: 10px; font-weight: 500; letter-spacing: 1.2px; color: rgba(7,18,56,0.55)">KIND OF HOME</span>
<div role="radiogroup" style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px"><sc-for list="{{types}}" as="t" hint-placeholder-count="4"><button type="button" role="radio" aria-checked="{{t.on}}" onClick="{{t.pick}}" style="{{t.style}}">{{t.l}}</button></sc-for></div>
</div>
<div style="display: flex; gap: 10px">
<div style="flex: 1; min-width: 0"><div style="display: flex; flex-direction: column; gap: 6px">
<span style="display: flex; align-items: center; gap: 3px; min-height: 13px"><span class="m" style="font-size: 10px; font-weight: 500; letter-spacing: 1.2px; color: rgba(7,18,56,0.55)">YEAR BUILT</span></span>
<input type="text" inputmode="numeric" maxlength="4" value="{{year}}" onChange="{{onYear}}" placeholder="1998" style="width: 100%; height: 50px; padding: 0 14px; font-size: 16px; border: 1px solid rgba(7,18,56,0.18); border-radius: 12px; box-sizing: border-box">
</div></div>
<div style="flex: 1; min-width: 0"><div style="display: flex; flex-direction: column; gap: 6px">
<span style="display: flex; align-items: center; gap: 3px; min-height: 13px"><span class="m" style="font-size: 10px; font-weight: 500; letter-spacing: 1.2px; color: rgba(7,18,56,0.55)">SQUARE FEET</span></span>
<input type="text" inputmode="numeric" value="{{sqft}}" onChange="{{onSqft}}" placeholder="2,000" style="width: 100%; height: 50px; padding: 0 14px; font-size: 16px; border: 1px solid rgba(7,18,56,0.18); border-radius: 12px; box-sizing: border-box">
</div></div>
</div>
<span class="m" style="margin-top: -12px; font-size: 10px; font-weight: 500; letter-spacing: 0.3px; line-height: 1.35; color: rgba(7,18,56,0.45)">{{fillNote}}</span>
<div style="margin-top: auto">
<sc-if value="{{ready}}" hint-placeholder-val="{{ false }}"><a href="OnbClimate.dc.html"  style="height: 54px; border-radius: 999px; background: #FF3B62; color: #FFFFFF; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center">Continue</a></sc-if>
<sc-if value="{{notReady}}" hint-placeholder-val="{{ true }}"><span aria-disabled="true" style="height: 54px; border-radius: 999px; background: rgba(7,18,56,0.08); color: rgba(7,18,56,0.35); font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center">Continue</span></sc-if>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const addr = st.addr !== undefined ? st.addr : '1428 Elm Hol';
    const picked = st.picked || null;
    const S = [['1428 Elm Hollow Ln', 'SPRINGFIELD · 35758'], ['1428 Elm Hollow Ct', 'SPRINGFIELD · 35749'], ['14280 Elm Hills Dr', 'GREENVILLE · 35801']];
    const q = addr.trim().toLowerCase();
    const sugg = S.filter(([a]) => q.length >= 3 && a.toLowerCase().startsWith(q.slice(0, 3)));
    const type = st.type || 'single';
    const T = [['single', 'Single-family'], ['town', 'Townhouse'], ['condo', 'Condo'], ['mobile', 'Manufactured']];
    const year = st.year !== undefined ? st.year : (picked ? '1998' : '');
    const sqft = st.sqft !== undefined ? st.sqft : (picked ? '2,140' : '');
    const yOk = !year || (/^\d{4}$/.test(year) && +year > 1700 && +year <= 2026);
    return {
      addr, onAddr: (e) => this.setState({ addr: e.target.value, picked: null }),
      addrBox: 'display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 14px; border-radius: 14px; box-sizing: border-box; background: #FFFFFF; border: ' + (picked ? '1.5px solid #071238' : '1.5px solid #FF3B62') + ';',
      showSugg: !picked && sugg.length > 0, picked: !!picked,
      sugg: sugg.map(([a, c]) => ({ a, c, pick: () => this.setState({ addr: a, picked: c }) })),
      cityLine: picked ? picked + ' · WE FOUND YEAR BUILT AND SIZE IN PUBLIC RECORDS' : '',
      types: T.map(([k, l]) => ({ l, on: type === k, pick: () => this.setState({ type: k }), style: 'height: 46px; border-radius: 12px; font-size: 14.5px; font-weight: 600; text-align: center; box-sizing: border-box; ' + (type === k ? 'border: 1.5px solid #071238; background: #071238; color: #FFFFFF;' : 'border: 1px solid rgba(7,18,56,0.18); background: #FFFFFF; color: rgba(7,18,56,0.75);') })),
      year, onYear: (e) => this.setState({ year: e.target.value }), sqft, onSqft: (e) => this.setState({ sqft: e.target.value }),
      fillNote: !yOk ? 'THAT YEAR LOOKS OFF — 4 DIGITS, LIKE 1998' : (picked ? 'PRE-FILLED · CHANGE IT IF IT’S WRONG' : 'NOT SURE? A GUESS IS FINE — YOU CAN CHANGE IT LATER'),
      ready: !!picked && yOk, notReady: !(picked && yOk)
    };
  }
}
</script>
</body>
</html>
