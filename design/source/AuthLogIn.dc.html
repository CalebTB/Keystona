<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Keystona log in</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.m{font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;border:0;background:none;padding:0;margin:0;cursor:pointer;text-align:left}
a{color:#071238;text-decoration:none}
input{font:inherit;color:#071238}
input::placeholder{color:rgba(7,18,56,0.35)}
input:focus{outline:none}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; color: #071238; display: flex; flex-direction: column; overflow: hidden; position: relative">

<div style="flex: 1; display: flex; flex-direction: column; padding: 8px 24px 34px; gap: 22px">
<a href="AuthWelcome.dc.html" aria-label="Back" style="width: 44px; height: 44px; margin-left: -10px; display: flex; align-items: center; justify-content: center; color: #071238">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6l6 6"></path></svg></a>
<header style="display: flex; flex-direction: column; gap: 8px; margin-top: -6px">
<h1 style="margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.9px; line-height: 1.1">Welcome back</h1>
<p style="margin: 0; font-size: 15px; line-height: 1.45; color: rgba(7,18,56,0.6)">Log in the same way you signed up.</p>
</header>

<div style="display: flex; flex-direction: column; gap: 12px">
<a href="#" style="height: 52px; border-radius: 14px; background: #000000; color: #FFFFFF; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center">Continue with Apple</a>
<a href="#" style="height: 52px; border-radius: 14px; background: #FFFFFF; border: 1px solid rgba(7,18,56,0.2); box-sizing: border-box; color: #1F1F1F; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center">Continue with Google</a>
</div>

<div style="display: flex; align-items: center; gap: 12px"><span style="flex: 1; height: 0.5px; background: rgba(7,18,56,0.15)"></span><span class="m" style="font-size: 10px; font-weight: 500; letter-spacing: 1.2px; color: rgba(7,18,56,0.55)">OR WITH EMAIL</span><span style="flex: 1; height: 0.5px; background: rgba(7,18,56,0.15)"></span></div>

<form onSubmit="{{noSubmit}}" style="display: flex; flex-direction: column; gap: 16px">
<label style="display: flex; flex-direction: column; gap: 6px">
<span class="m" style="font-size: 10px; font-weight: 500; letter-spacing: 1.2px; color: rgba(7,18,56,0.55)">EMAIL</span>
<span style="{{emailBox}}">
<input type="{{emailType}}" value="{{email}}" onChange="{{on_email}}" onBlur="{{blur_email}}" placeholder="you@example.com" autocomplete="email" aria-invalid="{{emailBad}}" style="flex: 1; min-width: 0; border: 0; background: transparent; font-size: 16px; height: 100%">

</span>
<sc-if value="{{emailBad}}" hint-placeholder-val="{{ false }}"><span class="m" role="alert" style="font-size: 11px; font-weight: 500; color: #B12347">{{emailMsg}}</span></sc-if>
</label>
<label style="display: flex; flex-direction: column; gap: 6px">
<span class="m" style="font-size: 10px; font-weight: 500; letter-spacing: 1.2px; color: rgba(7,18,56,0.55)">PASSWORD</span>
<span style="{{pwBox}}">
<input type="{{pwType}}" value="{{pw}}" onChange="{{on_pw}}" onBlur="{{blur_pw}}" placeholder="Your password" autocomplete="current-password" aria-invalid="{{pwBad}}" style="flex: 1; min-width: 0; border: 0; background: transparent; font-size: 16px; height: 100%">
<button type="button" onClick="{{toggleShow}}" aria-label="{{showLabel}}" style="height: 44px; margin-right: -6px; padding: 0 6px; font-size: 14px; font-weight: 600; color: rgba(7,18,56,0.6)">{{showText}}</button>
</span>
<sc-if value="{{pwBad}}" hint-placeholder-val="{{ false }}"><span class="m" role="alert" style="font-size: 11px; font-weight: 500; color: #B12347">{{pwMsg}}</span></sc-if>
</label>
<a href="AuthForgot.dc.html" style="align-self: flex-end; display: flex; align-items: center; min-height: 44px; margin: -12px 0 -8px; font-size: 14px; font-weight: 600; color: #B12347">Forgot password?</a>
</form>

<div style="margin-top: auto; display: flex; flex-direction: column; gap: 4px">
<sc-if value="{{ready}}" hint-placeholder-val="{{ false }}">
<a href="Tabbed.dc.html" style="height: 52px; border-radius: 14px; background: #FF3B62; color: #FFFFFF; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center">Log in</a>
</sc-if>
<sc-if value="{{notReady}}" hint-placeholder-val="{{ true }}">
<button type="button" disabled aria-disabled="true" style="height: 52px; border-radius: 14px; background: rgba(7,18,56,0.08); color: rgba(7,18,56,0.35); font-size: 16px; font-weight: 600; text-align: center; cursor: default">Log in</button>
</sc-if>
<div style="display: flex; justify-content: center; align-items: center; gap: 4px; min-height: 44px; font-size: 15px; color: rgba(7,18,56,0.6)">New to Keystona?<a href="AuthWelcome.dc.html" style="display: flex; align-items: center; min-height: 44px; padding: 0 4px; font-weight: 600; color: #B12347">Create an account</a></div>
</div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const v = (k) => st[k] || '';
    const touched = st.touched || {};
    const set = (k) => (e) => this.setState({ [k]: e.target.value });
    const blur = (k) => () => this.setState({ touched: Object.assign({}, touched, { [k]: true }) });
    const emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v('email'));
    const box = (bad, focusless) => 'display: flex; align-items: center; gap: 8px; height: 50px; padding: 0 14px; border-radius: 12px; box-sizing: border-box; border: ' + (bad ? '1.5px solid #FF3B62' : '1px solid rgba(7,18,56,0.18)') + ';';
    const show = !!st.show;

    const emailBad = !!touched.email && !!v('email') && !emailOk;
    const ready = emailOk && v('pw').length > 0;
    return {
      email: v('email'), pw: v('pw'),
      on_email: set('email'), on_pw: set('pw'), blur_email: blur('email'), blur_pw: () => {},
      emailType: 'email', pwType: show ? 'text' : 'password',
      emailBad, pwBad: false, emailMsg: 'Enter a valid email address', pwMsg: '',
      emailBox: box(emailBad), pwBox: box(false),
      toggleShow: () => this.setState({ show: !show }), showText: show ? 'Hide' : 'Show', showLabel: show ? 'Hide password' : 'Show password',
      ready, notReady: !ready,
      noSubmit: (e) => e.preventDefault()
    };
  }
}
</script>
</body>
</html>
