<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Keystona create account</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.m{font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;border:0;background:none;padding:0;margin:0;cursor:pointer;text-align:left}
a{color:#071238;text-decoration:none}
input{font:inherit;color:#071238}
input::placeholder{color:rgba(7,18,56,0.35)}
input:focus{outline:none}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; color: #071238; display: flex; flex-direction: column; overflow: hidden; position: relative">

<div style="flex: 1; display: flex; flex-direction: column; padding: 8px 24px 34px; gap: 22px">
<a href="AuthWelcome.dc.html" aria-label="Back" style="width: 44px; height: 44px; margin-left: -10px; display: flex; align-items: center; justify-content: center; color: #071238">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6l6 6"></path></svg></a>
<header style="display: flex; flex-direction: column; gap: 8px; margin-top: -6px">
<h1 style="margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.9px; line-height: 1.1">Create your account</h1>
<p style="margin: 0; font-size: 15px; line-height: 1.45; color: rgba(7,18,56,0.6)">Takes a minute. We'll send a link to confirm your email next.</p>
</header>

<form onSubmit="{{noSubmit}}" style="display: flex; flex-direction: column; gap: 16px">
<label style="display: flex; flex-direction: column; gap: 6px">
<span class="m" style="font-size: 10px; font-weight: 500; letter-spacing: 1.2px; color: rgba(7,18,56,0.55)">NAME</span>
<span style="{{nameBox}}">
<input type="{{nameType}}" value="{{name}}" onChange="{{on_name}}" onBlur="{{blur_name}}" placeholder="Jordan Smith" autocomplete="name" aria-invalid="{{nameBad}}" style="flex: 1; min-width: 0; border: 0; background: transparent; font-size: 16px; height: 100%">

</span>
<sc-if value="{{nameBad}}" hint-placeholder-val="{{ false }}"><span class="m" role="alert" style="font-size: 11px; font-weight: 500; color: #B12347">{{nameMsg}}</span></sc-if>
</label>
<label style="display: flex; flex-direction: column; gap: 6px">
<span class="m" style="font-size: 10px; font-weight: 500; letter-spacing: 1.2px; color: rgba(7,18,56,0.55)">EMAIL</span>
<span style="{{emailBox}}">
<input type="{{emailType}}" value="{{email}}" onChange="{{on_email}}" onBlur="{{blur_email}}" placeholder="you@example.com" autocomplete="email" aria-invalid="{{emailBad}}" style="flex: 1; min-width: 0; border: 0; background: transparent; font-size: 16px; height: 100%">

</span>
<sc-if value="{{emailBad}}" hint-placeholder-val="{{ false }}"><span class="m" role="alert" style="font-size: 11px; font-weight: 500; color: #B12347">{{emailMsg}}</span></sc-if>
</label>
<label style="display: flex; flex-direction: column; gap: 6px">
<span class="m" style="font-size: 10px; font-weight: 500; letter-spacing: 1.2px; color: rgba(7,18,56,0.55)">PASSWORD</span>
<span style="{{pwBox}}">
<input type="{{pwType}}" value="{{pw}}" onChange="{{on_pw}}" onBlur="{{blur_pw}}" placeholder="At least 8 characters" autocomplete="new-password" aria-invalid="{{pwBad}}" style="flex: 1; min-width: 0; border: 0; background: transparent; font-size: 16px; height: 100%">
<button type="button" onClick="{{toggleShow}}" aria-label="{{showLabel}}" style="height: 44px; margin-right: -6px; padding: 0 6px; font-size: 14px; font-weight: 600; color: rgba(7,18,56,0.6)">{{showText}}</button>
</span>
<sc-if value="{{pwBad}}" hint-placeholder-val="{{ false }}"><span class="m" role="alert" style="font-size: 11px; font-weight: 500; color: #B12347">{{pwMsg}}</span></sc-if>
</label>
<ul aria-label="Password needs" style="list-style: none; margin: -4px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{rules}}" as="r" hint-placeholder-count="3">
<li style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: {{r.color}}"><span style="{{r.dot}}"><sc-if value="{{r.ok}}" hint-placeholder-val="{{ false }}"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5l10-10"></path></svg></sc-if></span>{{r.text}}</li>
</sc-for>
</ul>
</form>

<div style="margin-top: auto; display: flex; flex-direction: column; gap: 12px">
<sc-if value="{{ready}}" hint-placeholder-val="{{ false }}">
<a href="AuthCheckEmail.dc.html" style="height: 52px; border-radius: 14px; background: #FF3B62; color: #FFFFFF; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center">Create account</a>
</sc-if>
<sc-if value="{{notReady}}" hint-placeholder-val="{{ true }}">
<button type="button" disabled aria-disabled="true" style="height: 52px; border-radius: 14px; background: rgba(7,18,56,0.08); color: rgba(7,18,56,0.35); font-size: 16px; font-weight: 600; text-align: center; cursor: default">Create account</button>
</sc-if>
<p class="m" style="margin: 0; text-align: center; font-size: 10px; font-weight: 500; letter-spacing: 0.3px; line-height: 1.5; color: rgba(7,18,56,0.5)">BY CONTINUING YOU AGREE TO THE <a href="#" style="color: rgba(7,18,56,0.75); text-decoration: underline">TERMS</a> AND <a href="#" style="color: rgba(7,18,56,0.75); text-decoration: underline">PRIVACY POLICY</a></p>
</div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const v = (k) => st[k] || '';
    const touched = st.touched || {};
    const set = (k) => (e) => this.setState({ [k]: e.target.value });
    const blur = (k) => () => this.setState({ touched: Object.assign({}, touched, { [k]: true }) });
    const emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v('email'));
    const box = (bad, focusless) => 'display: flex; align-items: center; gap: 8px; height: 50px; padding: 0 14px; border-radius: 12px; box-sizing: border-box; border: ' + (bad ? '1.5px solid #FF3B62' : '1px solid rgba(7,18,56,0.18)') + ';';
    const show = !!st.show;

    const pw = v('pw');
    const R = [
      { text: '8 or more characters', ok: pw.length >= 8 },
      { text: 'An uppercase and a lowercase letter', ok: /[A-Z]/.test(pw) && /[a-z]/.test(pw) },
      { text: 'A number', ok: /\d/.test(pw) }
    ];
    const pwOk = R.every(r => r.ok);
    const nameBad = !!touched.name && !v('name').trim();
    const emailBad = !!touched.email && !!v('email') && !emailOk;
    const ready = !!v('name').trim() && emailOk && pwOk;
    return {
      name: v('name'), email: v('email'), pw,
      on_name: set('name'), on_email: set('email'), on_pw: set('pw'),
      blur_name: blur('name'), blur_email: blur('email'), blur_pw: () => {},
      nameType: 'text', emailType: 'email', pwType: show ? 'text' : 'password',
      nameBad, emailBad, pwBad: false,
      nameMsg: 'Name is required', emailMsg: 'Enter a valid email address', pwMsg: '',
      nameBox: box(nameBad), emailBox: box(emailBad), pwBox: box(false),
      toggleShow: () => this.setState({ show: !show }), showText: show ? 'Hide' : 'Show', showLabel: show ? 'Hide password' : 'Show password',
      rules: R.map(r => ({ text: r.text, ok: r.ok, color: r.ok ? '#071238' : 'rgba(7,18,56,0.55)',
        dot: 'width: 16px; height: 16px; border-radius: 50%; box-sizing: border-box; display: flex; align-items: center; justify-content: center; flex-shrink: 0; ' + (r.ok ? 'background: #4A6604; color: #ECF87F;' : 'border: 1.5px solid rgba(7,18,56,0.25);') })),
      ready, notReady: !ready,
      noSubmit: (e) => e.preventDefault()
    };
  }
}
</script>
</body>
</html>
