<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Keystona OnbPersona</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.m{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;border:0;background:none;padding:0;margin:0;cursor:pointer;text-align:left}
a{color:#071238;text-decoration:none}a:hover{color:#2540D8}
@keyframes kpulse{0%{box-shadow:0 0 0 0 rgba(255,59,98,.5)}70%{box-shadow:0 0 0 6px rgba(255,59,98,0)}100%{box-shadow:0 0 0 0 rgba(255,59,98,0)}}
.pulse{animation:kpulse 1.8s infinite}
input,textarea{font:inherit;color:#071238}
input::placeholder,textarea::placeholder{color:rgba(7,18,56,0.35)}
input:focus,textarea:focus{outline:none}
textarea{resize:none}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; color: #071238; display: flex; flex-direction: column; position: relative; overflow: hidden">
<div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 0; height: 300px; background-image: linear-gradient(rgba(255,59,98,0.12) 1px, transparent 1px), linear-gradient(90deg, rgba(255,59,98,0.12) 1px, transparent 1px); background-size: 22px 22px; background-position: -1px -1px; -webkit-mask-image: linear-gradient(#000 40%, transparent); mask-image: linear-gradient(#000 40%, transparent)"></div>
<div style="position: relative; display: flex; align-items: center; gap: 12px; padding: 14px 16px 0">
<a href="AuthCheckEmail.dc.html" aria-label="Back" style="width: 44px; height: 44px; margin-left: -10px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6l6 6"></path></svg></a>
<div role="progressbar" aria-label="Setup" aria-valuemin="0" aria-valuemax="3" aria-valuenow="1" style="flex: 1; display: flex; gap: 6px"><span style="flex: 1; height: 4px; border-radius: 2px; background: #FF3B62;"></span><span style="flex: 1; height: 4px; border-radius: 2px; box-shadow: inset 0 0 0 1px rgba(7,18,56,0.2);"></span><span style="flex: 1; height: 4px; border-radius: 2px; box-shadow: inset 0 0 0 1px rgba(7,18,56,0.2);"></span></div>
<span class="m" style="font-size: 10px; font-weight: 700; letter-spacing: 1px; color: rgba(7,18,56,0.5); min-width: 44px; text-align: right">1 OF 3</span>
</div>
<main style="position: relative; flex: 1; min-height: 0; padding: 18px 20px 24px; display: flex; flex-direction: column; gap: 20px">

<header style="display: flex; flex-direction: column; gap: 8px; padding-top: 24px">
<span class="m" style="font-size: 10px; font-weight: 700; letter-spacing: 1.2px; color: #B12347">WELCOME, CALEB</span>
<h1 style="margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -1px; line-height: 1.1">Which sounds like you?</h1>
<p style="margin: 0; font-size: 15px; line-height: 1.5; color: rgba(7,18,56,0.65)">We'll set things up to match. You can add another home later.</p>
</header>
<div role="radiogroup" aria-label="Which sounds like you" style="display: flex; flex-direction: column; gap: 12px">
<sc-for list="{{opts}}" as="o" hint-placeholder-count="2">
<button type="button" role="radio" aria-checked="{{o.on}}" onClick="{{o.pick}}" style="{{o.box}}">
<span style="{{o.iconBox}}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="{{o.iconCol}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{o.icon}}"></path></svg></span>
<span style="flex: 1; display: flex; flex-direction: column; gap: 4px; text-align: left"><span style="font-size: 18px; font-weight: 700; letter-spacing: -0.3px">{{o.t}}</span><span style="font-size: 14px; line-height: 1.4; color: rgba(7,18,56,0.65)">{{o.d}}</span><span class="m" style="font-size: 10px; font-weight: 600; letter-spacing: 0.4px; color: rgba(7,18,56,0.5); margin-top: 2px">{{o.m}}</span></span>
<span style="{{o.radio}}"><span style="{{o.dot}}"></span></span>
</button>
</sc-for>
</div>
<div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px">
<sc-if value="{{chosen}}" hint-placeholder-val="{{ true }}"><a href="{{nextHref}}"  style="height: 54px; border-radius: 999px; background: #FF3B62; color: #FFFFFF; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center">Continue</a></sc-if>
<sc-if value="{{notChosen}}" hint-placeholder-val="{{ false }}"><span aria-disabled="true" style="height: 54px; border-radius: 999px; background: rgba(7,18,56,0.08); color: rgba(7,18,56,0.35); font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center">Continue</span></sc-if>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const k = st.k !== undefined ? st.k : 'own';
    const O = [
      ['own', 'I own a home', 'Just bought it, or been there for years. Track what you have and stay ahead of upkeep.', 'SYSTEMS · MAINTENANCE · WARRANTIES · PROJECTS', 'M16.555 3.843l3.602 3.602a2.877 2.877 0 0 1 0 4.069l-2.643 2.643a2.877 2.877 0 0 1-4.069 0l-.301-.301l-6.558 6.558a2 2 0 0 1-1.239.578l-.175.008h-1.172a1 1 0 0 1-.993-.883l-.007-.117v-1.172a2 2 0 0 1 .467-1.284l.119-.13l.414-.414h2v-2h2v-2l2.144-2.144l-.301-.301a2.877 2.877 0 0 1 0-4.069l2.643-2.643a2.877 2.877 0 0 1 4.069 0z M15 9h.01'],
      ['shop', 'I’m shopping for one', 'Compare homes you’re touring and keep inspection reports in one place.', 'SAVED HOMES · INSPECTIONS · WHAT TO ASK', 'M10 10m-7 0a7 7 0 1 0 14 0a7 7 0 1 0-14 0 M21 21l-6-6']
    ];
    return {
      chosen: !!k, notChosen: !k, nextHref: k === 'shop' ? 'ShopAdd.dc.html' : 'OnbProperty.dc.html',
      opts: O.map(([id, t, d, m, icon]) => ({ t, d, m, icon, on: k === id, pick: () => this.setState({ k: id }),
        box: 'width: 100%; display: flex; align-items: flex-start; gap: 14px; padding: 18px 16px; border-radius: 20px; box-sizing: border-box; background: #FFFFFF; ' + (k === id ? 'box-shadow: inset 0 0 0 2px #FF3B62;' : 'box-shadow: inset 0 0 0 1px rgba(7,18,56,0.16);'),
        iconBox: 'width: 48px; height: 48px; border-radius: 14px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; box-sizing: border-box; ' + (k === id ? 'background: #FF3B62;' : 'border: 1px solid rgba(7,18,56,0.16);'),
        iconCol: k === id ? '#FFFFFF' : '#071238',
        radio: 'width: 24px; height: 24px; border-radius: 50%; box-sizing: border-box; flex-shrink: 0; display: flex; align-items: center; justify-content: center; ' + (k === id ? 'border: 2px solid #FF3B62;' : 'border: 1.5px solid rgba(7,18,56,0.3);'),
        dot: k === id ? 'width: 12px; height: 12px; border-radius: 50%; background: #FF3B62;' : 'display: none;' }))
    };
  }
}
</script>
</body>
</html>
