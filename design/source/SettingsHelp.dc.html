body{margin:0}

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const q = (st.q || '').trim().toLowerCase();
    const topic = st.topic || null;
    const F = [
      ['start', 'Where do I start with a house I just bought?', 'Add your systems first — HVAC, water heater, roof. Each one brings its own maintenance reminders, so your task list fills itself in.'],
      ['start', 'Does Scan work on any label?', 'Most appliance and furnace labels, yes. Point at the sticker with the model and serial number; anything we can’t read stays blank for you to fill in.'],
      ['docs', 'How many documents can I keep for free?', '50 on the Free plan. Premium removes the limit. Nothing gets deleted if you go over — you just can’t add more until you upgrade or remove some.'],
      ['docs', 'Is my stuff private?', 'Yes. Documents are encrypted and only you and the people you invite can see them. We never sell or share your data.'],
      ['emergency', 'Does Emergency work without internet?', 'Yes. Shutoffs, contacts and insurance are saved on your phone, so they open even with no signal.'],
      ['plan', 'What happens when my free trial ends?', 'You’re charged on day 30 unless you cancel in the App Store first. We remind you on day 27. If you cancel, everything you added stays.']
    ];
    const T = [['start', 'Getting started', '2 ARTICLES'], ['docs', 'Documents', '2 ARTICLES'], ['emergency', 'Emergency', '1 ARTICLE'], ['plan', 'Plans & billing', '1 ARTICLE']];
    const open = st.open || { 0: true };
    const vis = F.map((f, i) => ({ f, i })).filter(({ f }) => (!topic || f[0] === topic) && (!q || (f[1] + ' ' + f[2]).toLowerCase().includes(q)));
    return {
      q: st.q || '', onQ: (e) => this.setState({ q: e.target.value }),
      topics: T.map(([k, n, c]) => ({ n, c, pick: () => this.setState({ topic: topic === k ? null : k }),
        style: 'display: flex; flex-direction: column; align-items: flex-start; gap: 3px; padding: 12px 14px; border-radius: 14px; box-sizing: border-box; text-align: left; ' + (topic === k ? 'box-shadow: inset 0 0 0 2px #071238;' : 'box-shadow: inset 0 0 0 1px rgba(7,18,56,0.14);') })),
      faqTitle: topic ? T.find(t => t[0] === topic)[1].toUpperCase() : (q ? 'RESULTS' : 'COMMON QUESTIONS'),
      faqs: vis.map(({ f, i }, k) => ({ q: f[1], a: f[2], open: !!open[i], sep: k ? 'border-top: 0.5px solid rgba(7,18,56,0.12);' : '',
        toggle: () => this.setState({ open: Object.assign({}, open, { [i]: !open[i] }) }),
        chev: 'display: flex; color: rgba(7,18,56,0.4); transition: transform .15s; transform: rotate(' + (open[i] ? 180 : 0) + 'deg);' })),
      none: vis.length === 0
    };
  }
}
</script>
