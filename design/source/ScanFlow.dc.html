<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Keystona scan</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.m{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;border:0;background:none;padding:0;margin:0;cursor:pointer;text-align:left}
a{color:#071238;text-decoration:none}a:hover{color:#2540D8}
@keyframes kpulse{0%{box-shadow:0 0 0 0 rgba(255,59,98,.5)}70%{box-shadow:0 0 0 6px rgba(255,59,98,0)}100%{box-shadow:0 0 0 0 rgba(255,59,98,0)}}
.pulse{animation:kpulse 1.8s infinite}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; color: #071238; position: relative; overflow: hidden">

<!-- STEP 1 · Home stays behind, sheet asks what you're scanning -->
<sc-if value="{{isChoose}}" hint-placeholder-val="{{ true }}">
<div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 390px; height: 1260px; pointer-events: none">
<dc-import name="Tabbed" hint-size="390px,1260px"></dc-import>
</div>
<a href="Tabbed.dc.html" aria-label="Close" style="position: absolute; inset: 0; background: rgba(7,18,56,0.45)"></a>

<section role="dialog" aria-label="What are you scanning?" style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFFFFF; border-radius: 28px 28px 0 0; padding: 10px 16px 34px; display: flex; flex-direction: column; gap: 16px">
<span aria-hidden="true" style="align-self: center; width: 36px; height: 5px; border-radius: 3px; background: rgba(7,18,56,0.18)"></span>
<div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 0 2px">
<div style="display: flex; flex-direction: column; gap: 6px">
<span class="m" style="font-size: 10px; font-weight: 500; letter-spacing: 1.2px; color: rgba(7,18,56,0.55)">SMART SCAN</span>
<h1 style="margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.7px; line-height: 1.1">What are you scanning?</h1>
<p style="margin: 0; font-size: 14px; line-height: 1.45; color: rgba(7,18,56,0.6)">Point at the label with the brand, model and serial number. We'll fill in the rest.</p>
</div>
<a href="Tabbed.dc.html" aria-label="Close" style="width: 44px; height: 44px; margin: -6px -8px 0 0; border-radius: 999px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: rgba(7,18,56,0.55)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6l-12 12"></path><path d="M6 6l12 12"></path></svg></a>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<button onClick="{{pick_sys}}" style="display: flex; align-items: center; gap: 14px; min-height: 76px; padding: 12px 14px; border: 1px solid rgba(7,18,56,0.12); border-radius: 16px; box-sizing: border-box; width: 100%">
<span style="width: 48px; height: 48px; border-radius: 14px; border: 1px solid rgba(7,18,56,0.14); display: flex; align-items: center; justify-content: center; flex-shrink: 0; box-sizing: border-box"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#071238" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 21v-16a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v16 M3 21h18 M9 8h6 M9 12h6 M9 16h6"></path></svg></span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 17px; font-weight: 700; letter-spacing: -0.3px">A system</span>
<span style="font-size: 13px; line-height: 1.35; color: rgba(7,18,56,0.6)">HVAC, water heater, electrical panel, roof, plumbing</span>
<span class="m" style="font-size: 10px; font-weight: 500; letter-spacing: 0.3px; line-height: 1.3; color: rgba(7,18,56,0.55)">5 IN YOUR HOME</span>
</span>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="rgba(7,18,56,0.35)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M9 6l6 6l-6 6"></path></svg>
</button>
<button onClick="{{pick_app}}" style="display: flex; align-items: center; gap: 14px; min-height: 76px; padding: 12px 14px; border: 1px solid rgba(7,18,56,0.12); border-radius: 16px; box-sizing: border-box; width: 100%">
<span style="width: 48px; height: 48px; border-radius: 14px; border: 1px solid rgba(7,18,56,0.14); display: flex; align-items: center; justify-content: center; flex-shrink: 0; box-sizing: border-box"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#071238" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1h-12a1 1 0 0 1-1-1v-16a1 1 0 0 1 1-1z M12 14m-4 0a4 4 0 1 0 8 0a4 4 0 1 0-8 0 M8 6.5h.01 M11 6.5h.01"></path></svg></span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 17px; font-weight: 700; letter-spacing: -0.3px">An appliance</span>
<span style="font-size: 13px; line-height: 1.35; color: rgba(7,18,56,0.6)">Fridge, washer, dryer, dishwasher, oven</span>
<span class="m" style="font-size: 10px; font-weight: 500; letter-spacing: 0.3px; line-height: 1.3; color: rgba(7,18,56,0.55)">5 IN YOUR HOME</span>
</span>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="rgba(7,18,56,0.35)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M9 6l6 6l-6 6"></path></svg>
</button>
</div>
<a href="#" style="display: flex; align-items: center; justify-content: center; min-height: 44px; font-size: 15px; font-weight: 600; color: rgba(7,18,56,0.6)">No label? Add it by hand</a>
</section>
</sc-if>

<!-- STEP 2 · Camera, framed for a rating label -->
<sc-if value="{{isCamera}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; inset: 0; background: radial-gradient(120% 80% at 50% 45%, #3A3F4A 0%, #15181F 70%); color: #FFFFFF">

<div style="position: absolute; left: 0; right: 0; top: 0; padding: 54px 12px 0; display: flex; align-items: center; justify-content: space-between">
<button onClick="{{back}}" aria-label="Back" style="width: 44px; height: 44px; border-radius: 999px; background: rgba(0,0,0,0.35); display: flex; align-items: center; justify-content: center; color: #FFFFFF"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6l6 6"></path></svg></button>
<span style="font-size: 16px; font-weight: 600">{{camTitle}}</span>
<button onClick="{{toggleFlash}}" aria-label="{{flashLabel}}" aria-pressed="{{flash}}" style="{{flashStyle}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 3v7h6l-8 11v-7h-6l8-11"></path></svg></button>
</div>

<!-- the label frame: brackets turn lime when the label is readable -->
<div style="position: absolute; left: 45px; top: 250px; width: 300px; height: 196px">
<span style="position: absolute; top: -2px; left: -2px; width: 34px; height: 34px; border-top: 4px solid {{bracket}}; border-left: 4px solid {{bracket}}; border-top-left-radius: 14px; transition: border-color .3s"></span><span style="position: absolute; top: -2px; right: -2px; width: 34px; height: 34px; border-top: 4px solid {{bracket}}; border-right: 4px solid {{bracket}}; border-top-right-radius: 14px; transition: border-color .3s"></span><span style="position: absolute; bottom: -2px; left: -2px; width: 34px; height: 34px; border-bottom: 4px solid {{bracket}}; border-left: 4px solid {{bracket}}; border-bottom-left-radius: 14px; transition: border-color .3s"></span><span style="position: absolute; bottom: -2px; right: -2px; width: 34px; height: 34px; border-bottom: 4px solid {{bracket}}; border-right: 4px solid {{bracket}}; border-bottom-right-radius: 14px; transition: border-color .3s"></span>
<div aria-hidden="true" style="position: absolute; inset: 22px 26px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.18); display: flex; flex-direction: column; justify-content: center; gap: 9px; padding: 0 16px">
<span style="height: 7px; width: 46%; border-radius: 3px; background: rgba(255,255,255,0.28)"></span>
<span style="height: 5px; width: 78%; border-radius: 3px; background: rgba(255,255,255,0.18)"></span>
<span style="height: 5px; width: 64%; border-radius: 3px; background: rgba(255,255,255,0.18)"></span>
<span style="height: 5px; width: 70%; border-radius: 3px; background: rgba(255,255,255,0.18)"></span>
</div>
</div>

<div style="position: absolute; left: 0; right: 0; top: 470px; display: flex; justify-content: center">
<span role="status" style="{{hintStyle}}">{{hint}}</span>
</div>

<div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 0 16px 34px; display: flex; flex-direction: column; align-items: center; gap: 20px">
<div role="tablist" aria-label="Scanning a system or an appliance" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 999px; background: rgba(0,0,0,0.35); width: 240px">
<button role="tab" aria-selected="{{isSys}}" onClick="{{pick_sys}}" style="{{sysTab}}">System</button>
<button role="tab" aria-selected="{{isApp}}" onClick="{{pick_app}}" style="{{appTab}}">Appliance</button>
</div>
<sc-if value="{{notShot}}" hint-placeholder-val="{{ true }}"><button onClick="{{shoot}}" aria-label="Take photo" style="width: 76px; height: 76px; border-radius: 50%; border: 4px solid #FFFFFF; box-sizing: border-box; display: flex; align-items: center; justify-content: center"><span style="width: 60px; height: 60px; border-radius: 50%; background: #FFFFFF"></span></button></sc-if>
<sc-if value="{{shot}}" hint-placeholder-val="{{ false }}"><a href="{{formHref}}" style="height: 56px; padding: 0 28px; border-radius: 999px; background: #FFFFFF; color: #071238; font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 8px">Review details<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6l-6 6"></path></svg></a></sc-if>
<a href="#" style="display: flex; align-items: center; min-height: 44px; font-size: 15px; font-weight: 600; color: rgba(255,255,255,0.8)">Type it in instead</a>
</div>
</div>
</sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  componentWillUnmount() { clearTimeout(this._t); }
  renderVals() {
    const st = this.state || {};
    const step = st.step || 'choose';
    const kind = st.kind || 'sys';
    const ready = !!st.ready;
    // pretend the camera finds the label a moment after it opens
    const open = (k) => () => { clearTimeout(this._t); this.setState({ step: 'camera', kind: k, ready: false, shot: false }); this._t = setTimeout(() => this.setState({ ready: true }), 1400); };
    const base = 'height: 36px; border-radius: 999px; font-size: 13px; font-weight: 600; text-align: center;';
    const on = base + ' background: #FFFFFF; color: #071238;', off = base + ' color: rgba(255,255,255,0.8);';
    const LIME = '#ECF87F';
    const hint = st.shot ? (kind === 'sys' ? 'Label read · 5 details found' : 'Label read · 6 details found') : ready ? 'Label found · hold still' : (kind === 'sys' ? 'Fit the rating plate inside the frame' : 'Fit the model & serial sticker inside the frame');
    return {
      isChoose: step === 'choose', isCamera: step === 'camera',
      pick_sys: open('sys'), pick_app: open('app'),
      back: () => { clearTimeout(this._t); this.setState({ step: 'choose', ready: false, shot: false }); },
      camTitle: kind === 'sys' ? 'Scan a system label' : 'Scan an appliance label',
      isSys: kind === 'sys', isApp: kind === 'app', sysTab: kind === 'sys' ? on : off, appTab: kind === 'app' ? on : off,
      bracket: ready ? LIME : 'rgba(255,255,255,0.9)',
      hint,
      hintStyle: 'display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 999px; font-size: 14px; font-weight: 600; ' + (ready || st.shot ? 'background: ' + LIME + '; color: #4A6604;' : 'background: rgba(0,0,0,0.45); color: #FFFFFF;'),
      flash: !!st.flash, flashLabel: st.flash ? 'Turn flash off' : 'Turn flash on',
      flashStyle: 'width: 44px; height: 44px; border-radius: 999px; display: flex; align-items: center; justify-content: center; ' + (st.flash ? 'background: #FFFFFF; color: #071238;' : 'background: rgba(0,0,0,0.35); color: #FFFFFF;'),
      toggleFlash: () => this.setState({ flash: !st.flash }),
      shoot: () => this.setState({ shot: true }),
      shot: !!st.shot, notShot: !st.shot,
      formHref: kind === 'sys' ? 'AddSystem.dc.html' : 'AddAppliance.dc.html'
    };
  }
}
</script>
</body>
</html>
