<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Keystona project notes</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.m{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;border:0;background:none;padding:0;margin:0;cursor:pointer;text-align:left}
a{color:#071238;text-decoration:none}a:hover{color:#2540D8}
@keyframes kpulse{0%{box-shadow:0 0 0 0 rgba(255,59,98,.5)}70%{box-shadow:0 0 0 6px rgba(255,59,98,0)}100%{box-shadow:0 0 0 0 rgba(255,59,98,0)}}
.pulse{animation:kpulse 1.8s infinite}
input,textarea{font:inherit;color:#071238}
input::placeholder,textarea::placeholder{color:rgba(7,18,56,0.35)}
input:focus,textarea:focus{outline:none}
textarea{resize:none}
textarea{font:inherit;color:#071238;resize:none}textarea:focus{outline:none}textarea::placeholder{color:rgba(7,18,56,0.35)}
</style>
</helmet>
<div style="width: 390px; min-height: 2000px; box-sizing: border-box; background: #FFFFFF; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; color: #071238; display: flex; flex-direction: column">
<main style="padding: 12px 16px 24px; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; align-items: center; justify-content: space-between">
<a href="ProjectDetail.dc.html" style="display: inline-flex; align-items: center; gap: 2px; min-height: 44px; margin-left: -6px; font-size: 15px; font-weight: 500"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6l6 6"></path></svg>Bath renovation</a>
</div>
<header style="display: flex; flex-direction: column; gap: 6px; margin-top: -8px">
<span class="m" style="font-size: 10px; font-weight: 500; letter-spacing: 1.2px; color: rgba(7,18,56,0.55)">PRIMARY BATH RENOVATION</span>
<h1 style="margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.9px; line-height: 1.1">Notes</h1>
<span class="m" style="font-size: 10px; font-weight: 500; letter-spacing: 0.3px; line-height: 1.3; color: rgba(7,18,56,0.55)">{{countText}}</span>
</header>

<!-- Quick note -->
<form onSubmit="{{post}}" style="display: flex; flex-direction: column; gap: 10px; padding: 12px; border: 1px solid rgba(7,18,56,0.16); border-radius: 16px">
<textarea rows="2" value="{{draft}}" onChange="{{onDraft}}" placeholder="What happened today?" aria-label="New note" style="width: 100%; border: 0; background: transparent; font-size: 16px; line-height: 1.45; padding: 2px"></textarea>
<div style="display: flex; align-items: center; gap: 6px">
<button type="button" aria-label="Add a photo" style="width: 36px; height: 36px; border-radius: 10px; border: 1px solid rgba(7,18,56,0.14); display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#071238" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 7h1a2 2 0 0 0 2-2a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1a2 2 0 0 0 2 2h1a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-14a2 2 0 0 1-2-2v-9a2 2 0 0 1 2-2"></path><path d="M12 13m-3 0a3 3 0 1 0 6 0a3 3 0 1 0-6 0"></path></svg></button>
<button type="button" onClick="{{cycleKind}}" style="{{kindBtn}}">{{kindLabel}}</button>
<span class="m" style="flex: 1; font-size: 10px; font-weight: 600; letter-spacing: 0.4px; color: rgba(7,18,56,0.45); text-align: right; padding-right: 4px">TILE &amp; FIXTURES</span>
<button type="submit" style="{{postBtn}}">Post</button>
</div>
</form>

<div role="tablist" aria-label="Filter" style="display: flex; gap: 6px; flex-wrap: wrap; margin-top: -4px">
<sc-for list="{{filters}}" as="f" hint-placeholder-count="4"><button type="button" role="tab" aria-selected="{{f.on}}" onClick="{{f.pick}}" style="{{f.style}}">{{f.label}}</button></sc-for>
</div>

<ol aria-label="Notes" style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{notes}}" as="n" hint-placeholder-count="6">
<li style="{{n.card}}">
<button type="button" onClick="{{n.toggle}}" aria-expanded="{{n.open}}" style="width: 100%; display: flex; flex-direction: column; gap: 5px; text-align: left">
<span style="display: flex; align-items: center; gap: 6px; flex-wrap: wrap"><span class="m" style="font-size: 10px; font-weight: 500; letter-spacing: 0.3px; line-height: 1.3; color: rgba(7,18,56,0.55)">{{n.date}}</span><span style="{{n.kindStyle}}">{{n.kind}}</span><sc-if value="{{n.pinned}}" hint-placeholder-val="{{ false }}"><span class="m" style="font-size: 9px; font-weight: 700; letter-spacing: 0.8px; color: #2540D8">· PINNED</span></sc-if></span>
<span style="font-size: 15px; font-weight: 700; line-height: 1.3">{{n.title}}</span>
<span style="{{n.bodyStyle}}">{{n.body}}</span>
</button>
<sc-if value="{{n.hasThumbs}}" hint-placeholder-val="{{ false }}"><span style="display: flex; gap: 4px"><sc-for list="{{n.thumbs}}" as="t" hint-placeholder-count="2"><span style="{{t}}"></span></sc-for></span></sc-if>
<span style="display: flex; flex-wrap: wrap; gap: 6px">
<span style="{{n.phaseStyle}}"><span style="{{n.phaseDot}}"></span>{{n.phase}}</span>
<sc-for list="{{n.links}}" as="l" hint-placeholder-count="1"><a href="{{l.href}}" class="m" style="display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 999px; border: 1px solid rgba(7,18,56,0.16); font-size: 9.5px; font-weight: 600; letter-spacing: 0.5px; color: #071238">{{l.label}}</a></sc-for>
</span>
</li>
</sc-for>
</ol>
</main>
<div style="margin-top: auto; position: sticky; bottom: 0">
<nav aria-label="Main tabs" style="height: 84px; box-sizing: border-box; border-top: 0.5px solid rgba(7,18,56,0.12); background: #FFFFFF; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding: 8px 0 22px; flex-shrink: 0">
<a href="Tabbed.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: rgba(7,18,56,0.35)">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l-2 0l9-9l9 9l-2 0"></path><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"></path><path d="M9 21v-6a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v6"></path></svg>
<span style="font-size: 10px; font-weight: 600">Home</span>
</a>
<a href="DocsSearchLed.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: rgba(7,18,56,0.35)">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3v4a1 1 0 0 0 1 1h4"></path><path d="M17 21h-10a2 2 0 0 1-2-2v-14a2 2 0 0 1 2-2h7l5 5v11a2 2 0 0 1-2 2z"></path></svg>
<span style="font-size: 10px; font-weight: 600">Docs</span>
</a>
<a href="Tasks.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: rgba(7,18,56,0.35)">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 12l5 5l10-10"></path><path d="M2 12l5 5m5-5l5-5"></path></svg>
<span style="font-size: 10px; font-weight: 600">Tasks</span>
</a>
<a href="ProjectsMany.dc.html" aria-current="page" style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #FF3B62">
<span style="position: absolute; top: -8px; left: 50%; margin-left: -10px; width: 20px; height: 3px; border-radius: 0 0 3px 3px; background: #FF3B62"></span>
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h6v8h-6z"></path><path d="M14 4h6v4h-6z"></path><path d="M4 16h6v4h-6z"></path><path d="M14 12h6v8h-6z"></path></svg>
<span style="font-size: 10px; font-weight: 700">Projects</span>
</a>
<a href="SettingsHub.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: rgba(7,18,56,0.35)">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 0 0 2.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 0 0 1.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 0 0-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 0 0-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 0 0-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 0 0-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 0 0 1.066-2.573c-.94-1.543.826-3.31 2.37-2.37c1 .608 2.296.07 2.572-1.065z"></path><path d="M9 12a3 3 0 1 0 6 0a3 3 0 0 0-6 0"></path></svg>
<span style="font-size: 10px; font-weight: 600">Settings</span>
</a>
</nav>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":2000}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const KIND = { note: ['NOTE', 'border: 1px solid rgba(7,18,56,0.16); color: rgba(7,18,56,0.55);', 'rgba(7,18,56,0.12)'], decided: ['DECIDED', 'border: 1px solid #4A6604; color: #4A6604;', '#4A6604'], follow: ['FOLLOW UP', 'border: 1px solid #B08A00; color: #6B4F00;', '#B08A00'] };
    const PH = { tile: ['TILE & FIXTURES', 'background: #2540D8;'], plumb: ['PLUMBING', 'background: #4A6604;'], demo: ['DEMO & PREP', 'background: #4A6604;'] };
    const N0 = [
      { id: 'n8', date: 'OCT 4', title: 'Grout: going with warm gray', body: 'Picked "Warm Gray 165" with Mike — hides dirt better than white on the floor. He needs it by Wed.', kind: 'decided', ph: 'tile', pinned: true, links: [["MIKE'S TILE & BATH", 'ContractorDetail.dc.html']] },
      { id: 'n7', date: 'OCT 1', title: 'Tile delivered, 2 boxes short', body: 'Stone & Tile Co. is reordering — arrives Oct 6. Mike says it won’t slow him down; he’ll start the floor first.', kind: 'follow', ph: 'tile', photos: 2, links: [["MIKE'S TILE & BATH", 'ContractorDetail.dc.html'], ['RECEIPT · $1,500', 'ProjectDocs.dc.html']] },
      { id: 'n6', date: 'SEP 28', title: 'Tiler started', body: 'Backer board up on the shower walls. Waterproofing cures overnight.', kind: 'note', ph: 'tile', photos: 3 },
      { id: 'n5', date: 'SEP 19', title: 'Passed plumbing inspection', body: 'Inspector signed off first try. Card is taped inside the vanity cabinet spot.', kind: 'note', ph: 'plumb', links: [['PERMIT', 'ProjectDocs.dc.html']] },
      { id: 'n4', date: 'SEP 12', title: 'Shower valve goes 2 inches higher', body: 'So the handle clears the niche. J&R moved it the same day.', kind: 'decided', ph: 'plumb', links: [['J&R PLUMBING', '#']] },
      { id: 'n3', date: 'SEP 8', title: 'Drain moved 8 inches', body: 'Centered under the new shower pan. No surprises in the subfloor.', kind: 'note', ph: 'plumb' },
      { id: 'n2', date: 'SEP 2', title: 'Old water stain under the tub', body: 'Subfloor was dry once opened up — old leak, already fixed. Took photos for the house history.', kind: 'note', ph: 'demo', photos: 1 },
      { id: 'n1', date: 'AUG 31', title: 'Day 1 — demo started', body: 'Before photos taken from the doorway, the vanity wall and the floor.', kind: 'note', ph: 'demo', photos: 3 }
    ];
    const list = (st.added || []).concat(N0);
    const f = st.f || 'all';
    const open = st.open || {};
    const vis = list.filter(n => f === 'all' || (f === 'decided' && n.kind === 'decided') || (f === 'follow' && n.kind === 'follow') || (f === 'photos' && n.photos));
    vis.sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0));
    const out = {};
    out.countText = list.length + ' NOTES · ' + list.filter(n => n.kind === 'decided').length + ' DECISIONS · ' + list.filter(n => n.kind === 'follow').length + ' TO FOLLOW UP';
    const fb = 'min-height: 34px; padding: 0 12px; border-radius: 999px; font-size: 13px; font-weight: 600; box-sizing: border-box;';
    out.filters = [['all', 'All'], ['decided', 'Decisions'], ['follow', 'Follow up'], ['photos', 'With photos']].map(([k, label]) => ({ label, on: f === k, pick: () => this.setState({ f: k }), style: fb + (f === k ? ' background: #071238; color: #FFFFFF;' : ' border: 1px solid rgba(7,18,56,0.18); color: rgba(7,18,56,0.7);') }));
    const thumb = 'width: 56px; height: 56px; border-radius: 8px; border: 1px solid rgba(37,64,216,0.25); background-color: #FFFFFF; background-image: linear-gradient(rgba(37,64,216,0.13) 1px, transparent 1px), linear-gradient(90deg, rgba(37,64,216,0.13) 1px, transparent 1px); background-size: 11px 11px; background-position: -1px -1px;';
    out.notes = vis.map(n => {
      const K = KIND[n.kind], o = !!open[n.id];
      return {
        date: n.date, title: n.title, body: n.body, kind: K[0], open: o, pinned: !!n.pinned,
        kindStyle: 'font-size: 9px; font-weight: 700; letter-spacing: 0.8px; padding: 2px 7px; border-radius: 999px; ' + K[1],
        card: 'display: flex; flex-direction: column; gap: 10px; padding: 14px; border: 1px solid rgba(7,18,56,0.12); border-radius: 16px;' + (n.kind !== 'note' ? ' box-shadow: inset 3px 0 0 ' + K[2] + ';' : ''),
        bodyStyle: 'font-size: 14px; line-height: 1.45; color: rgba(7,18,56,0.7);' + (o ? '' : ' display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;'),
        toggle: () => this.setState({ open: Object.assign({}, open, { [n.id]: !o }) }),
        hasThumbs: !!n.photos, thumbs: Array.from({ length: n.photos || 0 }, () => thumb),
        phase: PH[n.ph][0], phaseDot: 'width: 6px; height: 6px; border-radius: 50%; ' + PH[n.ph][1],
        phaseStyle: 'display: inline-flex; align-items: center; gap: 5px; padding: 3px 8px; border-radius: 999px; border: 1px solid rgba(7,18,56,0.12); font-size: 9.5px; font-weight: 600; letter-spacing: 0.5px; color: rgba(7,18,56,0.6);',
        links: (n.links || []).map(([label, href]) => ({ label, href }))
      };
    });
    // composer
    const draft = st.draft || '';
    const kinds = ['note', 'decided', 'follow'];
    const kind = st.kind || 'note';
    out.draft = draft; out.onDraft = (e) => this.setState({ draft: e.target.value });
    out.cycleKind = () => this.setState({ kind: kinds[(kinds.indexOf(kind) + 1) % 3] });
    out.kindLabel = KIND[kind][0];
    out.kindBtn = 'height: 36px; padding: 0 12px; border-radius: 10px; font-size: 11px; font-weight: 700; letter-spacing: 0.8px; box-sizing: border-box; ' + KIND[kind][1];
    out.postBtn = 'height: 36px; padding: 0 16px; border-radius: 999px; font-size: 14px; font-weight: 600; ' + (draft.trim() ? 'background: #2540D8; color: #FFFFFF;' : 'background: rgba(7,18,56,0.08); color: rgba(7,18,56,0.35);');
    out.post = (e) => {
      e.preventDefault();
      const t = draft.trim(); if (!t) return;
      const first = t.split(/[.\n]/)[0].slice(0, 60);
      this.setState({ draft: '', added: [{ id: 'x' + Date.now(), date: 'TODAY', title: first, body: t.length > first.length ? t : 'Just now.', kind, ph: 'tile' }].concat(st.added || []) });
    };
    return out;
  }
}
</script>
</body>
</html>
