<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Keystona add local shutoff</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.m{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;border:0;background:none;padding:0;margin:0;cursor:pointer;text-align:left}
a{color:#071238;text-decoration:none}a:hover{color:#2540D8}
@keyframes kpulse{0%{box-shadow:0 0 0 0 rgba(255,59,98,.5)}70%{box-shadow:0 0 0 6px rgba(255,59,98,0)}100%{box-shadow:0 0 0 0 rgba(255,59,98,0)}}
.pulse{animation:kpulse 1.8s infinite}
input,textarea{font:inherit;color:#071238}
input::placeholder,textarea::placeholder{color:rgba(7,18,56,0.35)}
input:focus,textarea:focus{outline:none}
textarea{resize:none}
</style>
</helmet>
<div style="width: 390px; height: 1060px; box-sizing: border-box; background: #FFFFFF; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; color: #071238; position: relative; overflow: hidden">
<div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 390px; height: 1780px; pointer-events: none">
<dc-import name="ShutoffWater" hint-size="390px,1780px"></dc-import>
</div>
<a href="ShutoffWater.dc.html" aria-label="Close" style="position: absolute; inset: 0; background: rgba(7,18,56,0.45)"></a>

<section role="dialog" aria-label="Add a local shutoff" style="position: absolute; left: 0; right: 0; top: 64px; bottom: 0; background: #FFFFFF; border-radius: 22px 22px 0 0; display: flex; flex-direction: column">
<span aria-hidden="true" style="align-self: center; margin-top: 8px; width: 36px; height: 4px; border-radius: 3px; background: rgba(7,18,56,0.2)"></span>
<div style="display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; padding: 6px 16px 10px; border-bottom: 0.5px solid rgba(7,18,56,0.12)">
<a href="ShutoffWater.dc.html" style="justify-self: start; display: flex; align-items: center; min-height: 44px; font-size: 15px; font-weight: 500; color: rgba(7,18,56,0.6)">Cancel</a>
<h1 style="margin: 0; font-size: 16px; font-weight: 700; letter-spacing: -0.3px">Add a local shutoff.</h1>
<span style="justify-self: end">
<sc-if value="{{ready}}" hint-placeholder-val="{{ false }}"><a href="ShutoffWater.dc.html" style="display: flex; align-items: center; height: 36px; padding: 0 16px; border-radius: 999px; background: #2540D8; color: #FFFFFF; font-size: 14px; font-weight: 600">Save</a></sc-if>
<sc-if value="{{notReady}}" hint-placeholder-val="{{ true }}"><span aria-disabled="true" style="display: flex; align-items: center; height: 36px; padding: 0 16px; border-radius: 999px; background: rgba(7,18,56,0.08); color: rgba(7,18,56,0.35); font-size: 14px; font-weight: 600">Save</span></sc-if>
</span>
</div>

<form onSubmit="{{noSubmit}}" style="flex: 1; padding: 18px 16px 30px; display: flex; flex-direction: column; gap: 20px">

<div style="display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid rgba(7,18,56,0.12); border-radius: 12px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#071238" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M7.502 19.423c2.602 2.105 6.395 2.105 8.996 0c2.602-2.105 3.262-5.708 1.566-8.546l-4.89-7.26c-.42-.625-1.287-.803-1.936-.397a1.376 1.376 0 0 0-.41.397l-4.893 7.26c-1.695 2.838-1.035 6.441 1.567 8.546z"></path></svg>
<span style="flex: 1; font-size: 13px; line-height: 1.4; color: rgba(7,18,56,0.7)">Water · your <span style="font-weight: 600; color: #071238">main shutoff</span> in the basement stays first on the page.</span>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<label style="display: flex; flex-direction: column; gap: 6px">
<span style="display: flex; align-items: center; gap: 3px; min-height: 13px"><span class="m" style="font-size: 10px; font-weight: 500; letter-spacing: 1.2px; color: rgba(7,18,56,0.55)">WHAT DOES IT CONTROL</span><span aria-hidden="true" style="color: #FF3B62; font-weight: 700">*</span></span>
<input type="text" value="{{ctrl}}" onChange="{{on_ctrl}}" aria-required="true" placeholder="e.g. Upstairs bathroom" style="width: 100%; height: 50px; padding: 0 14px; font-size: 16px; border: 1px solid rgba(7,18,56,0.18); border-radius: 12px; box-sizing: border-box">
</label>
<div style="display: flex; flex-wrap: wrap; gap: 6px"><button type="button" onClick="{{chip_0}}" style="{{chip_0_style}}">Bathroom</button><button type="button" onClick="{{chip_1}}" style="{{chip_1_style}}">Toilet</button><button type="button" onClick="{{chip_2}}" style="{{chip_2_style}}">Kitchen sink</button><button type="button" onClick="{{chip_3}}" style="{{chip_3_style}}">Washer</button><button type="button" onClick="{{chip_4}}" style="{{chip_4_style}}">Water heater</button><button type="button" onClick="{{chip_5}}" style="{{chip_5_style}}">Irrigation</button><button type="button" onClick="{{chip_6}}" style="{{chip_6_style}}">Outdoor spigot</button></div>
</div>

<label style="display: flex; flex-direction: column; gap: 6px">
<span style="display: flex; align-items: center; gap: 3px; min-height: 13px"><span class="m" style="font-size: 10px; font-weight: 500; letter-spacing: 1.2px; color: rgba(7,18,56,0.55)">WHERE IS IT</span><span aria-hidden="true" style="color: #FF3B62; font-weight: 700">*</span></span>
<textarea rows="2" value="{{loc}}" onChange="{{on_loc}}" aria-required="true" placeholder="e.g. Behind the toilet, low on the wall" style="width: 100%; padding: 12px 14px; font-size: 16px; line-height: 1.4; border: 1px solid rgba(7,18,56,0.18); border-radius: 12px; box-sizing: border-box"></textarea>
</label>

<div style="display: flex; flex-direction: column; gap: 6px">
<span style="display: flex; align-items: center; gap: 3px; min-height: 13px"><span class="m" style="font-size: 10px; font-weight: 500; letter-spacing: 1.2px; color: rgba(7,18,56,0.55)">HANDLE</span></span>
<div role="radiogroup" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px"><button type="button" role="radio" aria-checked="{{valve_oval}}" onClick="{{pick_valve_oval}}" style="{{valve_oval_style}}">Oval knob</button><button type="button" role="radio" aria-checked="{{valve_lever}}" onClick="{{pick_valve_lever}}" style="{{valve_lever_style}}">Lever</button><button type="button" role="radio" aria-checked="{{valve_wheel}}" onClick="{{pick_valve_wheel}}" style="{{valve_wheel_style}}">Wheel</button></div>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<span style="display: flex; align-items: center; gap: 3px; min-height: 13px"><span class="m" style="font-size: 10px; font-weight: 500; letter-spacing: 1.2px; color: rgba(7,18,56,0.55)">WHICH WAY TO TURN IT</span></span>
<div role="radiogroup" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px"><button type="button" role="radio" aria-checked="{{turn_cw}}" onClick="{{pick_turn_cw}}" style="{{turn_cw_style}}">Clockwise</button><button type="button" role="radio" aria-checked="{{turn_ccw}}" onClick="{{pick_turn_ccw}}" style="{{turn_ccw_style}}">Counterclockwise</button></div>
<span class="m" style="font-size: 10px; font-weight: 500; letter-spacing: 0.3px; line-height: 1.35; color: rgba(7,18,56,0.45)">RIGHTY-TIGHTY · LEVERS GO CROSSWISE TO THE PIPE</span></div>

<label style="display: flex; flex-direction: column; gap: 6px">
<span style="display: flex; align-items: center; gap: 3px; min-height: 13px"><span class="m" style="font-size: 10px; font-weight: 500; letter-spacing: 1.2px; color: rgba(7,18,56,0.55)">ANYTHING ELSE</span></span>
<textarea rows="2" value="{{notes}}" onChange="{{on_notes}}" placeholder="e.g. Sticks a little — turn firmly" style="width: 100%; padding: 12px 14px; font-size: 16px; line-height: 1.4; border: 1px solid rgba(7,18,56,0.18); border-radius: 12px; box-sizing: border-box"></textarea>
</label>

<div style="display: flex; flex-direction: column; gap: 8px">
<span class="m" style="font-size: 10px; font-weight: 500; letter-spacing: 1.2px; color: rgba(7,18,56,0.55)">PHOTO</span>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px"><button type="button" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; aspect-ratio: 4 / 3; border-radius: 14px; border: 1.5px dashed rgba(7,18,56,0.22); color: rgba(7,18,56,0.55)"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 7h1a2 2 0 0 0 2-2a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1a2 2 0 0 0 2 2h1a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-14a2 2 0 0 1-2-2v-9a2 2 0 0 1 2-2 M12 13m-3 0a3 3 0 1 0 6 0a3 3 0 1 0-6 0"></path></svg><span class="m" style="font-size: 9.5px; font-weight: 600; letter-spacing: 0.6px; text-align: center; line-height: 1.35">WHERE IT IS</span></button><button type="button" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; aspect-ratio: 4 / 3; border-radius: 14px; border: 1.5px dashed rgba(7,18,56,0.22); color: rgba(7,18,56,0.55)"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 7h1a2 2 0 0 0 2-2a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1a2 2 0 0 0 2 2h1a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-14a2 2 0 0 1-2-2v-9a2 2 0 0 1 2-2 M12 13m-3 0a3 3 0 1 0 6 0a3 3 0 1 0-6 0"></path></svg><span class="m" style="font-size: 9.5px; font-weight: 600; letter-spacing: 0.6px; text-align: center; line-height: 1.35">CLOSE-UP<br>OF THE VALVE</span></button></div>
</div>

<div style="display: flex; align-items: center; justify-content: center; gap: 6px">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="rgba(7,18,56,0.45)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 18h.01"></path><path d="M9.172 15.172a4 4 0 0 1 5.656 0"></path><path d="M3 3l18 18"></path></svg>
<span class="m" style="font-size: 10px; font-weight: 500; letter-spacing: 0.3px; line-height: 1.35; color: rgba(7,18,56,0.45)">SAVED ON THIS PHONE · WORKS WITHOUT INTERNET</span>
</div>
</form>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1060}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const v = (k, d) => st[k] !== undefined ? st[k] : d;
    const set = (k) => (e) => this.setState({ [k]: e.target.value });
    const out = { noSubmit: (e) => e.preventDefault() };
    const segBase = 'height: 46px; border-radius: 12px; font-size: 14px; font-weight: 600; text-align: center; box-sizing: border-box;';
    [['valve', ['oval', 'lever', 'wheel'], 'oval'], ['turn', ['cw', 'ccw'], 'cw']].forEach(([k, opts, d]) => {
      const cur = v(k, d);
      opts.forEach(o => {
        out[k + '_' + o] = cur === o;
        out['pick_' + k + '_' + o] = () => this.setState({ [k]: o });
        out[k + '_' + o + '_style'] = segBase + (cur === o ? ' border: 1.5px solid #071238; background: #071238; color: #FFFFFF;' : ' border: 1px solid rgba(7,18,56,0.18); color: rgba(7,18,56,0.7);');
      });
    });
    const CH = ['Bathroom', 'Toilet', 'Kitchen sink', 'Washer', 'Water heater', 'Irrigation', 'Outdoor spigot'];
    const ctrl = v('ctrl', '');
    CH.forEach((c, i) => {
      const on = ctrl === c;
      out['chip_' + i] = () => this.setState({ ctrl: c });
      out['chip_' + i + '_style'] = 'height: 34px; padding: 0 12px; border-radius: 999px; font-size: 13px; font-weight: 600; box-sizing: border-box; ' + (on ? 'background: #071238; color: #FFFFFF; border: 1px solid #071238;' : 'border: 1px solid rgba(7,18,56,0.16); color: rgba(7,18,56,0.7);');
    });
    out.ctrl = ctrl; out.on_ctrl = set('ctrl');
    out.loc = v('loc', ''); out.on_loc = set('loc');
    out.notes = v('notes', ''); out.on_notes = set('notes');
    out.ready = !!ctrl.trim() && !!out.loc.trim(); out.notReady = !out.ready;
    return out;
  }
}
</script>
</body>
</html>
