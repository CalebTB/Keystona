<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Keystona edit phase</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.m{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;border:0;background:none;padding:0;margin:0;cursor:pointer;text-align:left}
a{color:#071238;text-decoration:none}a:hover{color:#2540D8}
@keyframes kpulse{0%{box-shadow:0 0 0 0 rgba(255,59,98,.5)}70%{box-shadow:0 0 0 6px rgba(255,59,98,0)}100%{box-shadow:0 0 0 0 rgba(255,59,98,0)}}
.pulse{animation:kpulse 1.8s infinite}
input,textarea{font:inherit;color:#071238}
input::placeholder,textarea::placeholder{color:rgba(7,18,56,0.35)}
input:focus,textarea:focus{outline:none}
textarea{resize:none}
input[type=date]::-webkit-calendar-picker-indicator{opacity:0.5}
.grab{touch-action:none;cursor:grab}.grab:active{cursor:grabbing}
</style>
</helmet>
<div style="width: 390px; height: 940px; box-sizing: border-box; background: #FFFFFF; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; color: #071238; position: relative; overflow: hidden">
<div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 390px; height: 1240px; pointer-events: none">
<dc-import name="PhasesEditor" hint-size="390px,1240px"></dc-import>
</div>
<a href="PhasesEditor.dc.html" aria-label="Close" style="position: absolute; inset: 0; background: rgba(7,18,56,0.45)"></a>

<section role="dialog" aria-label="Edit phase" style="position: absolute; left: 0; right: 0; top: 96px; bottom: 0; background: #FFFFFF; border-radius: 22px 22px 0 0; display: flex; flex-direction: column">
<span aria-hidden="true" style="align-self: center; margin-top: 8px; width: 36px; height: 4px; border-radius: 3px; background: rgba(7,18,56,0.2)"></span>
<div style="display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; padding: 6px 16px 10px; border-bottom: 0.5px solid rgba(7,18,56,0.12)">
<a href="PhasesEditor.dc.html" style="justify-self: start; display: flex; align-items: center; min-height: 44px; font-size: 15px; font-weight: 500; color: rgba(7,18,56,0.6)">Cancel</a>
<h1 style="margin: 0; font-size: 16px; font-weight: 700; letter-spacing: -0.3px">Edit phase.</h1>
<span style="justify-self: end">
<sc-if value="{{ok}}" hint-placeholder-val="{{ true }}"><a href="PhasesEditor.dc.html" style="display: flex; align-items: center; height: 36px; padding: 0 14px; border-radius: 999px; background: #2540D8; color: #FFFFFF; font-size: 14px; font-weight: 600; white-space: nowrap">Save phase</a></sc-if>
<sc-if value="{{notOk}}" hint-placeholder-val="{{ false }}"><span aria-disabled="true" style="display: flex; align-items: center; height: 36px; padding: 0 14px; border-radius: 999px; background: rgba(7,18,56,0.08); color: rgba(7,18,56,0.35); font-size: 14px; font-weight: 600; white-space: nowrap">Save phase</span></sc-if>
</span>
</div>

<form onSubmit="{{noSubmit}}" style="flex: 1; min-height: 0; overflow-y: auto; padding: 18px 16px 30px; display: flex; flex-direction: column; gap: 22px">
<section style="display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="display: flex; align-items: center; gap: 3px; min-height: 13px"><span class="m" style="font-size: 10px; font-weight: 500; letter-spacing: 1.2px; color: rgba(7,18,56,0.55)">PHASE NAME</span><span aria-hidden="true" style="color: #FF3B62; font-weight: 700">*</span></span>
<input type="text" value="{{name}}" onChange="{{on_name}}" aria-required="true" maxlength="60" placeholder="e.g. Tile & fixtures" style="width: 100%; height: 50px; padding: 0 14px; font-size: 16px; border: 1px solid rgba(7,18,56,0.18); border-radius: 12px; box-sizing: border-box">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="display: flex; align-items: center; gap: 3px; min-height: 13px"><span class="m" style="font-size: 10px; font-weight: 500; letter-spacing: 1.2px; color: rgba(7,18,56,0.55)">WHAT HAPPENS</span></span>
<textarea rows="2" value="{{desc}}" onChange="{{on_desc}}" maxlength="300" placeholder="What gets done in this phase" style="width: 100%; padding: 12px 14px; font-size: 16px; line-height: 1.4; border: 1px solid rgba(7,18,56,0.18); border-radius: 12px; box-sizing: border-box"></textarea>
</div>
</section>

<section style="display: flex; flex-direction: column; gap: 12px">
<h2 class="m" style="margin: 0; display: flex; align-items: center; gap: 7px; font-size: 10px; font-weight: 600; letter-spacing: 1.2px"><span style="width: 6px; height: 6px; border-radius: 50%; background: #2540D8"></span>SCHEDULE</h2>
<div style="display: flex; gap: 10px">
<div style="flex: 1; min-width: 0"><div style="display: flex; flex-direction: column; gap: 6px">
<span style="display: flex; align-items: center; gap: 3px; min-height: 13px"><span class="m" style="font-size: 10px; font-weight: 500; letter-spacing: 1.2px; color: rgba(7,18,56,0.55)">STARTS</span></span>
<input type="date" value="{{start}}" onChange="{{on_start}}" style="width: 100%; height: 50px; padding: 0 12px; font-size: 15px; border: 1px solid rgba(7,18,56,0.18); border-radius: 12px; box-sizing: border-box">
</div></div>
<div style="flex: 1; min-width: 0"><div style="display: flex; flex-direction: column; gap: 6px">
<span style="display: flex; align-items: center; gap: 3px; min-height: 13px"><span class="m" style="font-size: 10px; font-weight: 500; letter-spacing: 1.2px; color: rgba(7,18,56,0.55)">ENDS</span></span>
<input type="date" value="{{end}}" onChange="{{on_end}}" style="{{endStyle}}">
</div></div>
</div>
<span style="{{schedHelpStyle}}">{{schedHelp}}</span>
</section>

<section style="display: flex; flex-direction: column; gap: 12px">
<h2 class="m" style="margin: 0; display: flex; align-items: center; gap: 7px; font-size: 10px; font-weight: 600; letter-spacing: 1.2px"><span style="width: 6px; height: 6px; border-radius: 50%; background: #2540D8"></span>BUDGET</h2>
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="display: flex; align-items: center; gap: 3px; min-height: 13px"><span class="m" style="font-size: 10px; font-weight: 500; letter-spacing: 1.2px; color: rgba(7,18,56,0.55)">SET ASIDE FOR THIS PHASE</span></span>
<span style="display: flex; align-items: center; gap: 4px; height: 50px; padding: 0 14px; border: 1px solid rgba(7,18,56,0.18); border-radius: 12px; box-sizing: border-box"><span style="font-size: 16px; color: rgba(7,18,56,0.5)">$</span><input type="text" inputmode="numeric" value="{{plan}}" onChange="{{on_plan}}" style="flex: 1; min-width: 0; height: 100%; border: 0; background: transparent; font-size: 16px; font-variant-numeric: tabular-nums"></span>
</div>
<div style="display: flex; align-items: center; gap: 10px">
<span aria-hidden="true" style="flex: 1; height: 6px; border-radius: 3px; box-shadow: inset 0 0 0 1px rgba(7,18,56,0.2); overflow: hidden"><span style="{{fill}}"></span></span>
<span style="{{spentStyle}}">{{spentText}}</span>
</div>
<span class="m" style="font-size: 10px; font-weight: 500; letter-spacing: 0.3px; line-height: 1.35; color: rgba(7,18,56,0.45)">{{leftText}}</span>
</section>

<section style="display: flex; flex-direction: column; gap: 12px">
<h2 class="m" style="margin: 0; display: flex; align-items: center; gap: 7px; font-size: 10px; font-weight: 600; letter-spacing: 1.2px"><span style="width: 6px; height: 6px; border-radius: 50%; background: #2540D8"></span>STATUS</h2>
<div role="radiogroup" aria-label="Status" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{statuses}}" as="o" hint-placeholder-count="4"><button type="button" role="radio" aria-checked="{{o.on}}" aria-disabled="{{o.off}}" onClick="{{o.pick}}" style="{{o.style}}">{{o.label}}</button></sc-for>
</div>
<span class="m" style="font-size: 10px; font-weight: 500; letter-spacing: 0.3px; line-height: 1.35; color: rgba(7,18,56,0.45)">{{statusHelp}}</span>
</section>

<div style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding-top: 4px">
<a href="PhasesEditor.dc.html" style="min-height: 44px; display: flex; align-items: center; padding: 0 16px; font-size: 14px; font-weight: 600; color: #B12347">Delete this phase</a>
<span class="m" style="font-size: 10px; font-weight: 500; letter-spacing: 0.3px; line-height: 1.35; color: rgba(7,18,56,0.45)">BUDGET ITEMS AND NOTES STAY ON THE PROJECT</span>
</div>
</form>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":940}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const v = (k, d) => st[k] !== undefined ? st[k] : d;
    const set = (k) => (e) => this.setState({ [k]: e.target.value });
    const out = { noSubmit: (e) => e.preventDefault() };
    out.name = v('name', 'Tile & fixtures'); out.on_name = set('name');
    out.desc = v('desc', 'Floor and shower tile, vanity, toilet and shower trim. Tiler on site Mon–Thu.'); out.on_desc = set('desc');
    out.start = v('start', '2026-09-28'); out.on_start = set('start');
    out.end = v('end', '2026-10-23'); out.on_end = set('end');
    const box = 'width: 100%; height: 50px; padding: 0 12px; font-size: 15px; border-radius: 12px; box-sizing: border-box; ';
    const d = (s) => { const p = s.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); };
    const days = Math.round((d(out.end) - d(out.start)) / 86400000) + 1;
    const bad = !(days >= 1);
    out.endStyle = box + (bad ? 'border: 1.5px solid #FF3B62;' : 'border: 1px solid rgba(7,18,56,0.18);');
    // next phase starts Oct 26 — warn if this runs into it
    const overlap = !bad && d(out.end) >= new Date(2026, 9, 26);
    out.schedHelp = bad ? 'ENDS BEFORE IT STARTS — PICK A LATER END DATE' : (overlap ? days + ' DAYS · RUNS INTO PAINT & TRIM (STARTS OCT 26)' : days + ' DAYS · PAINT & TRIM STARTS OCT 26');
    out.schedHelpStyle = 'font-size: 10px; font-weight: ' + (bad || overlap ? 600 : 500) + '; letter-spacing: 0.3px; line-height: 1.35; color: ' + (bad ? '#B12347' : overlap ? '#6B4F00' : 'rgba(7,18,56,0.45)') + ';';
    out.plan = v('plan', '6,000'); out.on_plan = set('plan');
    const plan = parseInt(String(out.plan).replace(/[^0-9]/g, ''), 10) || 0;
    const spent = 4580;
    const pct = plan ? spent / plan : 2;
    const col = pct > 1 ? '#FF3B62' : (pct >= 0.8 ? '#B08A00' : '#2540D8');
    out.fill = 'display: block; height: 100%; width: ' + Math.min(100, Math.round(pct * 100)) + '%; background: ' + col + ';';
    out.spentText = '$4,580 spent';
    out.spentStyle = 'font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; flex-shrink: 0; color: ' + (pct > 1 ? '#B12347' : pct >= 0.8 ? '#6B4F00' : '#071238') + ';';
    const left = plan - spent;
    out.leftText = left >= 0 ? '$' + left.toLocaleString('en-US') + ' LEFT IN THIS PHASE · ' + Math.round(pct * 100) + '% USED' : '$' + (-left).toLocaleString('en-US') + ' OVER — RAISE IT OR MOVE MONEY FROM CONTINGENCY';
    // status: only real moves from Active (Planned is off once work started)
    const s = v('s', 'active');
    const ALLOWED = { active: ['active', 'done', 'skipped'], scheduled: ['scheduled', 'active', 'skipped'], done: ['done', 'active'], skipped: ['skipped', 'scheduled'] };
    const from = 'active';
    out.statuses = [['scheduled', 'Planned'], ['active', 'Active'], ['done', 'Done'], ['skipped', 'Skip']].map(([k, label]) => {
      const off = !ALLOWED[from].includes(k);
      return { label, on: s === k, off, pick: () => { if (!off) this.setState({ s: k }); },
        style: 'height: 44px; border-radius: 12px; font-size: 14px; font-weight: 600; text-align: center; box-sizing: border-box; ' +
          (s === k ? 'border: 1.5px solid #071238; background: #071238; color: #FFFFFF;' : off ? 'border: 1px dashed rgba(7,18,56,0.15); color: rgba(7,18,56,0.3); cursor: default;' : 'border: 1px solid rgba(7,18,56,0.18); color: rgba(7,18,56,0.7);') };
    });
    out.statusHelp = s === 'done' ? 'MARKS IT FINISHED · PAINT & TRIM BECOMES THE NEXT PHASE' : s === 'skipped' ? 'STAYS IN THE LIST, CROSSED OUT · LEAVES THE PROGRESS BAR' : 'PLANNED IS OFF — WORK ON THIS PHASE HAS STARTED';
    const ok = !!out.name.trim() && !bad;
    out.ok = ok; out.notOk = !ok;
    return out;
  }
}
</script>
</body>
</html>
