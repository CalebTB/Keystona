<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Keystona ReportProjects</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.m{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;border:0;background:none;padding:0;margin:0;cursor:pointer;text-align:left}
a{color:#071238;text-decoration:none}a:hover{color:#2540D8}
@keyframes kpulse{0%{box-shadow:0 0 0 0 rgba(255,59,98,.5)}70%{box-shadow:0 0 0 6px rgba(255,59,98,0)}100%{box-shadow:0 0 0 0 rgba(255,59,98,0)}}
.pulse{animation:kpulse 1.8s infinite}
input,textarea{font:inherit;color:#071238}
input::placeholder,textarea::placeholder{color:rgba(7,18,56,0.35)}
input:focus,textarea:focus{outline:none}
textarea{resize:none}
select{appearance:none;-webkit-appearance:none;background:transparent;border:0;font:inherit;color:#071238}select:focus{outline:none}
input[type=time]::-webkit-calendar-picker-indicator{opacity:0.5}
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
textarea{font:inherit;color:#071238;resize:none}textarea:focus{outline:none}textarea::placeholder{color:rgba(7,18,56,0.35)}input::placeholder{color:rgba(7,18,56,0.35)}.sb>*{flex-shrink:0}
</style>
</helmet>
<div style="width: 390px; height: 1000px; box-sizing: border-box; background: #FFFFFF; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; color: #071238; position: relative; overflow: hidden">
<div aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none"><dc-import name="ReportBuilder" hint-size="390px,1960px"></dc-import></div>
<a href="ReportBuilder.dc.html" aria-label="Close" style="position: absolute; inset: 0; background: rgba(7,18,56,0.45)"></a>
<section role="dialog" aria-label="Projects in the report" style="position: absolute; left: 0; right: 0; top: 60px; bottom: 0; background: #FFFFFF; border-radius: 22px 22px 0 0; display: flex; flex-direction: column">
<span aria-hidden="true" style="align-self: center; margin-top: 8px; width: 36px; height: 4px; border-radius: 3px; background: rgba(7,18,56,0.2)"></span>
<div style="display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; padding: 6px 16px 10px; border-bottom: 0.5px solid rgba(7,18,56,0.12)">
<a href="ReportBuilder.dc.html" style="justify-self: start; display: flex; align-items: center; min-height: 44px; font-size: 15px; font-weight: 500; color: rgba(7,18,56,0.6)">Cancel</a>
<h1 style="margin: 0; font-size: 16px; font-weight: 700">Projects in the report</h1>
<span style="justify-self: end"><sc-if value="{{ready}}" hint-placeholder-val="{{ true }}"><a href="ReportBuilder.dc.html" style="display: flex; align-items: center; height: 36px; padding: 0 16px; border-radius: 999px; background: #2540D8; color: #FFFFFF; font-size: 14px; font-weight: 600">Done</a></sc-if><sc-if value="{{notReady}}" hint-placeholder-val="{{ true }}"><span aria-disabled="true" style="display: flex; align-items: center; height: 36px; padding: 0 16px; border-radius: 999px; background: rgba(7,18,56,0.08); color: rgba(7,18,56,0.35); font-size: 14px; font-weight: 600">Save</span></sc-if></span>
</div>
<div class="sb" style="flex: 1; min-height: 0; overflow-y: auto; padding: 16px 16px 30px; display: flex; flex-direction: column; gap: 20px">
<p style="margin: 0; font-size: 14px; line-height: 1.5; color: rgba(7,18,56,0.65)">Each one gets a short entry: a before &amp; after, what it cost, who did it and what&rsquo;s on file.</p>
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px"><sc-for list="{{projs}}" as="p" hint-placeholder-count="4"><li style="{{p.card}}">
<button type="button" role="checkbox" aria-checked="{{p.on}}" onClick="{{p.flip}}" style="width: 100%; display: flex; align-items: flex-start; gap: 12px; padding: 12px 14px; text-align: left">
<span style="{{p.box}}"><sc-if value="{{p.on}}" hint-placeholder-val="{{ true }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5l10-10"></path></svg></sc-if></span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px"><span style="display: flex; justify-content: space-between; gap: 8px"><span style="{{p.tStyle}}">{{p.name}}</span><span style="font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums">{{p.cost}}</span></span><span class="m" style="font-size: 10px; font-weight: 500; letter-spacing: 0.3px; line-height: 1.3; color: rgba(7,18,56,0.55)">{{p.when}} · {{p.photos}}</span><span class="m" style="{{p.docStyle}}">{{p.docd}}</span><sc-if value="{{p.hasNote}}" hint-placeholder-val="{{ false }}"><span style="font-size: 12.5px; color: rgba(7,18,56,0.55)">{{p.note}}</span></sc-if></span>
</button>
</li></sc-for></ul>
<section style="display: flex; flex-direction: column; gap: 8px"><div style="display: flex; align-items: center; justify-content: space-between; min-height: 20px"><h2 class="m" style="margin: 0; font-size: 10px; font-weight: 500; letter-spacing: 1.2px; color: rgba(7,18,56,0.55)">STILL GOING</h2></div>
<div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 16px; border: 1px dashed rgba(7,18,56,0.22)"><span style="flex: 1; display: flex; flex-direction: column; gap: 3px"><span style="font-size: 15px; font-weight: 600">Primary bath renovation</span><span class="m" style="font-size: 10px; font-weight: 500; letter-spacing: 0.3px; line-height: 1.3; color: rgba(7,18,56,0.55)">PHASE 3 OF 5 · SHOWS AS “IN PROGRESS” IF YOU ADD IT</span></span><button type="button" role="switch" aria-checked="{{inprog}}" aria-label="Include the bath renovation as in progress" onClick="{{flipInprog}}" style="{{ipTrack}}"><span style="{{ipKnob}}"></span></button></div>
<span class="m" style="font-size: 10px; font-weight: 500; letter-spacing: 0.3px; line-height: 1.35; color: rgba(7,18,56,0.45)">HANDY IF YOU LIST BEFORE IT’S FINISHED · BUYERS SEE THE PLAN AND THE PERMIT</span>
</section>
</div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const chips = (key, opts, cur) => opts.map(([k, l]) => ({ l, on: cur === k, pick: () => this.setState({ [key]: k }), style: 'height: 36px; padding: 0 12px; border-radius: 999px; font-size: 13.5px; font-weight: 600; box-sizing: border-box; ' + (cur === k ? 'background: #071238; color: #FFFFFF;' : 'border: 1px solid rgba(7,18,56,0.18); color: rgba(7,18,56,0.75);') }));
    const sw = (on) => 'width: 51px; height: 31px; border-radius: 999px; position: relative; flex-shrink: 0; transition: background .15s; background: ' + (on ? '#2540D8' : 'rgba(7,18,56,0.16)') + ';';
    const kn = (on) => 'position: absolute; top: 2px; left: ' + (on ? 22 : 2) + 'px; width: 27px; height: 27px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 2px 4px rgba(7,18,56,0.25); transition: left .15s;';

    const P = [["ac", "Central AC replacement", "JUN 2026 \u00b7 2 DAYS", "$6,450", "6 PHOTOS", "3 OF 3 DOCUMENTED \u00b7 PERMIT + 10-YR WARRANTY", true, ""], ["gb", "Guest bath refresh", "APR\u2013MAY 2026 \u00b7 5 WEEKS", "$2,240", "31 PHOTOS", "3 OF 4 DOCUMENTED", true, ""], ["dv", "Dryer vent reroute", "FEB 2026 \u00b7 1 DAY", "$380", "2 PHOTOS", "1 OF 1 DOCUMENTED", true, ""], ["hc", "Hall closet shelving", "MAR 2026 \u00b7 WEEKEND", "$310", "NO PHOTOS", "OWNER-REPORTED", false, "Small DIY jobs can make a report look padded."]];
    const on = st.on || {}, ph = st.ph || {};
    const isOn = (p) => on[p[0]] !== undefined ? on[p[0]] : p[6];
    const ip = !!st.ip;
    return {
      projs: P.map((p) => { const o = isOn(p); const docd = p[5] !== 'OWNER-REPORTED'; const cur = ph[p[0]] || (p[4] === 'NO PHOTOS' ? 'none' : 'pair'); return {
        name: p[1], when: p[2], cost: p[3], photos: p[4], docd: p[5], note: p[7], hasNote: !!p[7] && !o, on: o,
        flip: () => this.setState({ on: Object.assign({}, on, { [p[0]]: !o }) }),
        card: 'border-radius: 16px; overflow: hidden; ' + (o ? 'border: 1.5px solid #071238;' : 'border: 1px solid rgba(7,18,56,0.12);'),
        box: 'width: 24px; height: 24px; border-radius: 7px; box-sizing: border-box; flex-shrink: 0; margin-top: 1px; display: flex; align-items: center; justify-content: center; ' + (o ? 'background: #2540D8; color: #FFFFFF;' : 'border: 1.5px solid rgba(7,18,56,0.3);'),
        tStyle: 'font-size: 15.5px; font-weight: 700; ' + (o ? '' : 'color: rgba(7,18,56,0.5);'),
        docStyle: 'font-size: 9.5px; font-weight: 700; letter-spacing: 0.5px; color: ' + (docd ? '#4A6604' : 'rgba(7,18,56,0.5)') + ';',
        photoOpts: [['pair', 'Before & after'], ['all', 'Best 6'], ['none', 'No photos']].map(([k, l]) => ({ l, on: cur === k, pick: () => this.setState({ ph: Object.assign({}, ph, { [p[0]]: k }) }),
          style: 'height: 32px; padding: 0 11px; border-radius: 999px; font-size: 12.5px; font-weight: 600; box-sizing: border-box; ' + (cur === k ? 'background: #071238; color: #FFFFFF;' : 'border: 1px solid rgba(7,18,56,0.18); color: rgba(7,18,56,0.7);') })) }; }),
      inprog: ip, flipInprog: () => this.setState({ ip: !ip }), ipTrack: sw(ip), ipKnob: kn(ip),
      ready: true, notReady: false
    };
  }
}
</script>
</body>
</html>
