<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const n = st.n || 0;
    const busy = !!st.busy;
    return {
      title: n >= 2 ? 'Still can’t reach Keystona' : 'We couldn’t load your documents',
      body: n >= 2 ? 'It’s probably on our end. Your files are safe — we’ll keep trying in the background and refresh when we’re back.' : 'Your files are safe. Check your connection, or give it another try.',
      retry: () => { if (busy) return; this.setState({ busy: true }); setTimeout(() => this.setState({ busy: false, n: n + 1 }), 900); },
      retryLabel: busy ? 'Trying…' : (n >= 2 ? 'Try again' : 'Try again'),
      retryBtn: 'margin-top: 6px; display: flex; align-items: center; justify-content: center; gap: 8px; height: 52px; padding: 0 28px; border-radius: 999px; font-size: 16px; font-weight: 700; ' + (busy ? 'background: rgba(37,64,216,0.5); color: #FFFFFF;' : 'background: #2540D8; color: #FFFFFF;'),
      spin: 'display: flex; ' + (busy ? 'animation: kspin .8s linear infinite;' : ''),
      iconWrap: 'width: 76px; height: 76px; border-radius: 50%; border: 1.5px solid #FF3B62; display: flex; align-items: center; justify-content: center; margin-bottom: 4px;'
    };
  }
}
