<div style="width: 390px; height: 1440px; box-sizing: border-box; background: #FFFFFF; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; color: #071238; position: relative; overflow: hidden">

<span aria-hidden="true" style="align-self: center; margin-top: 8px; width: 36px; height: 4px; border-radius: 3px; background: rgba(7,18,56,0.2)"></span>

<a href="ProjectsMany.dc.html" style="justify-self: start; display: flex; align-items: center; min-height: 44px; font-size: 15px; font-weight: 500; color: rgba(7,18,56,0.6)">Cancel</a>

</div>
<div class="sb" style="flex: 1; min-height: 0; overflow-y: auto; padding: 16px 16px 30px; display: flex; flex-direction: column; gap: 20px">
<div style="display: grid; grid-template-columns: 2fr 1fr; gap: 8px"><div style="position: relative"><div style="position: relative; aspect-ratio: 16 / 10; border-radius: 14px; overflow: hidden; border: 1px solid rgba(37,64,216,0.25); background-image: linear-gradient(rgba(37,64,216,0.11) 1px, transparent 1px), linear-gradient(90deg, rgba(37,64,216,0.11) 1px, transparent 1px); background-size: 22px 22px; background-position: -1px -1px"><span class="m" style="position: absolute; left: 8px; bottom: 8px; padding: 2px 7px; border-radius: 999px; background: #FFFFFF; border: 1px solid rgba(7,18,56,0.12); font-size: 8.5px; font-weight: 700; letter-spacing: 0.8px; color: rgba(7,18,56,0.6)">COVER PHOTO</span></div></div><button type="button" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; border-radius: 14px; border: 1.5px dashed rgba(7,18,56,0.22); color: rgba(7,18,56,0.55)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 7h1a2 2 0 0 0 2-2a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1a2 2 0 0 0 2 2h1a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-14a2 2 0 0 1-2-2v-9a2 2 0 0 1 2-2"></path><path d="M9 13a3 3 0 1 0 6 0a3 3 0 0 0-6 0"></path></svg><span class="m" style="font-size: 9px; font-weight: 700; letter-spacing: 0.6px">BEFORE PHOTO</span></button></div>
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="display: flex; align-items: center; gap: 3px; min-height: 13px"><span class="m" style="font-size: 10px; font-weight: 500; letter-spacing: 1.2px; color: rgba(7,18,56,0.55)">NAME</span><span aria-hidden="true" style="color: #FF3B62; font-weight: 700">*</span></span>
<input type="text" inputmode="text" value="{{name}}" onChange="{{on_name}}" placeholder="e.g. Hall bath refresh"  style="width: 100%; height: 50px; padding: 0 14px; font-size: 16px; border: 1px solid rgba(7,18,56,0.18); border-radius: 12px; box-sizing: border-box">
</div>
<div style="display: flex; flex-direction: column; gap: 8px"><span class="m" style="font-size: 10px; font-weight: 500; letter-spacing: 1.2px; color: rgba(7,18,56,0.55)">WHAT KIND</span><div role="radiogroup" style="display: flex; gap: 6px; flex-wrap: wrap"><sc-for list="{{kinds}}" as="c" hint-placeholder-count="6"><button type="button" role="radio" aria-checked="{{c.on}}" onClick="{{c.pick}}" style="{{c.style}}">{{c.l}}</button></sc-for></div></div>
<div style="display: flex; flex-direction: column; gap: 8px"><span class="m" style="font-size: 10px; font-weight: 500; letter-spacing: 1.2px; color: rgba(7,18,56,0.55)">WHO&rsquo;S DOING IT</span><div role="radiogroup" style="display: flex; gap: 6px; flex-wrap: wrap"><sc-for list="{{whos}}" as="c" hint-placeholder-count="6"><button type="button" role="radio" aria-checked="{{c.on}}" onClick="{{c.pick}}" style="{{c.style}}">{{c.l}}</button></sc-for></div></div>
<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px"><div style="display: flex; flex-direction: column; gap: 6px">
<span style="display: flex; align-items: center; gap: 3px; min-height: 13px"><span class="m" style="font-size: 10px; font-weight: 500; letter-spacing: 1.2px; color: rgba(7,18,56,0.55)">START</span></span>
<input type="text" inputmode="text" value="{{start}}" onChange="{{on_start}}" placeholder="MM / DD"  style="width: 100%; height: 50px; padding: 0 14px; font-size: 16px; border: 1px solid rgba(7,18,56,0.18); border-radius: 12px; box-sizing: border-box">
</div><div style="display: flex; flex-direction: column; gap: 6px">
<span style="display: flex; align-items: center; gap: 3px; min-height: 13px"><span class="m" style="font-size: 10px; font-weight: 500; letter-spacing: 1.2px; color: rgba(7,18,56,0.55)">TARGET FINISH</span></span>
<input type="text" inputmode="text" value="{{end}}" onChange="{{on_end}}" placeholder="MM / DD"  style="width: 100%; height: 50px; padding: 0 14px; font-size: 16px; border: 1px solid rgba(7,18,56,0.18); border-radius: 12px; box-sizing: border-box">
<span class="m" style="font-size: 10px; font-weight: 500; letter-spacing: 0.3px; line-height: 1.35; color: rgba(7,18,56,0.45)">{{weeks}}</span></div></div>
<section style="display: flex; flex-direction: column; gap: 8px"><div style="display: flex; align-items: center; justify-content: space-between; min-height: 20px"><h2 class="m" style="margin: 0; font-size: 10px; font-weight: 500; letter-spacing: 1.2px; color: rgba(7,18,56,0.55)">BUDGET</h2></div>
<div style="display: grid; grid-template-columns: 1.3fr 1fr; gap: 8px"><div style="display: flex; flex-direction: column; gap: 6px">
<span style="display: flex; align-items: center; gap: 3px; min-height: 13px"><span class="m" style="font-size: 10px; font-weight: 500; letter-spacing: 1.2px; color: rgba(7,18,56,0.55)">TOTAL</span></span>
<input type="text" inputmode="decimal" value="{{budget}}" onChange="{{on_budget}}" placeholder="$0"  style="width: 100%; height: 50px; padding: 0 14px; font-size: 16px; border: 1px solid rgba(7,18,56,0.18); border-radius: 12px; box-sizing: border-box">
</div><div style="display: flex; flex-direction: column; gap: 6px"><span class="m" style="font-size: 10px; font-weight: 500; letter-spacing: 1.2px; color: rgba(7,18,56,0.55)">CUSHION</span><div role="radiogroup" style="display: flex; gap: 6px; flex-wrap: wrap"><sc-for list="{{cushions}}" as="c" hint-placeholder-count="6"><button type="button" role="radio" aria-checked="{{c.on}}" onClick="{{c.pick}}" style="{{c.style}}">{{c.l}}</button></sc-for></div></div></div>
<span class="m" style="font-size: 10px; font-weight: 500; letter-spacing: 0.3px; line-height: 1.35; color: rgba(7,18,56,0.45)">{{cushionHelp}}</span>
</section>
<section style="display: flex; flex-direction: column; gap: 8px"><div style="display: flex; align-items: center; justify-content: space-between; min-height: 20px"><h2 class="m" style="margin: 0; font-size: 10px; font-weight: 500; letter-spacing: 1.2px; color: rgba(7,18,56,0.55)">START WITH THESE PHASES</h2><span class="m" style="font-size: 10px; font-weight: 500; letter-spacing: 0.3px; line-height: 1.3; color: rgba(7,18,56,0.55)">EDIT ANY TIME</span></div>
<div style="display: flex; flex-direction: column; gap: 6px"><sc-for list="{{phases}}" as="p" hint-placeholder-count="5"><span style="display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 12px; border: 1px solid rgba(7,18,56,0.12)"><span class="m" style="width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid rgba(7,18,56,0.3); box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 800">{{p.n}}</span><span style="flex: 1; font-size: 14.5px; font-weight: 600">{{p.name}}</span><span class="m" style="font-size: 10px; font-weight: 500; letter-spacing: 0.3px; line-height: 1.3; color: rgba(7,18,56,0.55)">{{p.amt}}</span></span></sc-for></div>
<span class="m" style="font-size: 10px; font-weight: 500; letter-spacing: 0.3px; line-height: 1.35; color: rgba(7,18,56,0.45)">{{phaseHelp}}</span>
</section>
<div style="display: flex; flex-direction: column; gap: 6px"><span class="m" style="font-size: 10px; font-weight: 500; letter-spacing: 1.2px; color: rgba(7,18,56,0.55)">LINK IT TO</span><div style="display: flex; gap: 6px; flex-wrap: wrap"><span style="display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: 999px; background: #071238; color: #FFFFFF; font-size: 13px; font-weight: 600">Hall bath</span><button type="button" style="display: inline-flex; align-items: center; gap: 5px; height: 34px; padding: 0 12px; border-radius: 999px; border: 1.5px dashed rgba(7,18,56,0.25); font-size: 13px; font-weight: 600; color: rgba(7,18,56,0.7)"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5l0 14"></path><path d="M5 12l14 0"></path></svg>A system or appliance</button></div></div>
</div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1440}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const chips = (key, opts, cur) => opts.map(([k, l]) => ({ l, on: cur === k, pick: () => this.setState({ [key]: k }), style: 'height: 36px; padding: 0 12px; border-radius: 999px; font-size: 13.5px; font-weight: 600; box-sizing: border-box; ' + (cur === k ? 'background: #071238; color: #FFFFFF;' : 'border: 1px solid rgba(7,18,56,0.18); color: rgba(7,18,56,0.75);') }));
    const sw = (on) => 'width: 51px; height: 31px; border-radius: 999px; position: relative; flex-shrink: 0; transition: background .15s; background: ' + (on ? '#2540D8' : 'rgba(7,18,56,0.16)') + ';';
    const kn = (on) => 'position: absolute; top: 2px; left: ' + (on ? 22 : 2) + 'px; width: 27px; height: 27px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 2px 4px rgba(7,18,56,0.25); transition: left .15s;';

    const v = (k, d) => st[k] !== undefined ? st[k] : d;
    const out = {};
    const D = { name: 'Hall bath refresh', start: '11 / 02', end: '12 / 11', budget: '$6,500' };
    Object.keys(D).forEach((k) => { out[k] = v(k, D[k]); out['on_' + k] = (e) => this.setState({ [k]: e.target.value }); });
    const kind = v('kind', 'reno');
    out.kinds = chips('kind', [['reno', 'Renovation'], ['repair', 'Repair'], ['upgrade', 'Upgrade'], ['outdoor', 'Outdoor'], ['other', 'Other']], kind);
    out.whos = chips('who', [['diy', 'Me (DIY)'], ['pro', 'A contractor'], ['both', 'Both']], v('who', 'both'));
    out.cushions = chips('cush', [['0', 'None'], ['10', '10%'], ['15', '15%']], v('cush', '10'));
    const num = (s) => parseFloat(String(s).replace(/[^0-9.]/g, '')) || 0;
    const b = num(out.budget), c = +v('cush', '10');
    out.cushionHelp = b ? ('$' + Math.round(b * c / 100).toLocaleString('en-US') + ' SET ASIDE FOR SURPRISES · $' + Math.round(b * (1 - c / 100)).toLocaleString('en-US') + ' TO PLAN WITH') : 'A ROUGH NUMBER IS FINE';
    out.weeks = '6 WEEKS';
    const P = { reno: [['Demo & prep', 0.12], ['Rough-in', 0.2], ['Tile & fixtures', 0.4], ['Paint & trim', 0.13], ['Final walkthrough', 0.15]], repair: [['Get quotes', 0.05], ['Fix it', 0.85], ['Check it works', 0.1]],
      upgrade: [['Pick it out', 0.1], ['Install', 0.8], ['Clean up', 0.1]], outdoor: [['Plan & permit', 0.1], ['Ground work', 0.3], ['Build', 0.5], ['Finish', 0.1]], other: [['Plan', 0.2], ['Do it', 0.7], ['Wrap up', 0.1]] }[kind];
    const plan = b * (1 - c / 100);
    out.phases = P.map(([name, f], i) => ({ n: String(i + 1), name, amt: b ? '$' + (Math.round(plan * f / 10) * 10).toLocaleString('en-US') : '' }));
    out.phaseHelp = 'A ' + ({ reno: 'RENOVATION', repair: 'REPAIR', upgrade: 'UPGRADE', outdoor: 'OUTDOOR', other: '' }[kind] + ' TEMPLATE').trim() + ' · BUDGET SPLIT IS A GUESS FROM SIMILAR PROJECTS';
    out.ready = !!out.name.trim(); out.notReady = !out.ready;
    return out;
  }
}
</script>
