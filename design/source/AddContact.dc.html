<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.m{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;border:0;background:none;padding:0;margin:0;cursor:pointer;text-align:left}
a{color:#071238;text-decoration:none}a:hover{color:#2540D8}
@keyframes kpulse{0%{box-shadow:0 0 0 0 rgba(255,59,98,.5)}70%{box-shadow:0 0 0 6px rgba(255,59,98,0)}100%{box-shadow:0 0 0 0 rgba(255,59,98,0)}}
.pulse{animation:kpulse 1.8s infinite}
input,textarea{font:inherit;color:#071238}
input::placeholder,textarea::placeholder{color:rgba(7,18,56,0.35)}
input:focus,textarea:focus{outline:none}
textarea{resize:none}
select{appearance:none;-webkit-appearance:none;background:transparent;border:0;font:inherit;color:#071238}select:focus{outline:none}
input[type=time]::-webkit-calendar-picker-indicator{opacity:0.5}
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
textarea{font:inherit;color:#071238;resize:none}textarea:focus{outline:none}textarea::placeholder{color:rgba(7,18,56,0.35)}input::placeholder{color:rgba(7,18,56,0.35)}.sb>*{flex-shrink:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; color: #071238; position: relative; overflow: hidden">
<div aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none"><dc-import name="EmergencyContacts" hint-size="390px,930px"></dc-import></div>
<a href="EmergencyContacts.dc.html" aria-label="Close" style="position: absolute; inset: 0; background: rgba(7,18,56,0.45)"></a>
<section role="dialog" aria-label="Add a contact" style="position: absolute; left: 0; right: 0; top: 56px; bottom: 0; background: #FFFFFF; border-radius: 22px 22px 0 0; display: flex; flex-direction: column">
<span aria-hidden="true" style="align-self: center; margin-top: 8px; width: 36px; height: 4px; border-radius: 3px; background: rgba(7,18,56,0.2)"></span>
<div style="display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; padding: 6px 16px 10px; border-bottom: 0.5px solid rgba(7,18,56,0.12)">
<a href="EmergencyContacts.dc.html" style="justify-self: start; display: flex; align-items: center; min-height: 44px; font-size: 15px; font-weight: 500; color: rgba(7,18,56,0.6)">Cancel</a>
<h1 style="margin: 0; font-size: 16px; font-weight: 700">Add a contact</h1>
<span style="justify-self: end"><sc-if value="{{ready}}" hint-placeholder-val="{{ false }}"><a href="EmergencyContacts.dc.html" style="display: flex; align-items: center; height: 36px; padding: 0 16px; border-radius: 999px; background: #2540D8; color: #FFFFFF; font-size: 14px; font-weight: 600">Save</a></sc-if><sc-if value="{{notReady}}" hint-placeholder-val="{{ true }}"><span aria-disabled="true" style="display: flex; align-items: center; height: 36px; padding: 0 16px; border-radius: 999px; background: rgba(7,18,56,0.08); color: rgba(7,18,56,0.35); font-size: 14px; font-weight: 600">Save</span></sc-if></span>
</div>
<div class="sb" style="flex: 1; min-height: 0; overflow-y: auto; padding: 16px 16px 30px; display: flex; flex-direction: column; gap: 20px">
<button type="button" style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 46px; border-radius: 14px; border: 1.5px solid #2540D8; color: #2540D8; font-size: 15px; font-weight: 600"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2540D8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 7m-4 0a4 4 0 1 0 8 0a4 4 0 1 0-8 0"></path><path d="M3 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path><path d="M21 21v-2a4 4 0 0 0-3-3.85"></path></svg>Pick from my phone&rsquo;s contacts</button>
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="display: flex; align-items: center; gap: 3px; min-height: 13px"><span class="m" style="font-size: 10px; font-weight: 500; letter-spacing: 1.2px; color: rgba(7,18,56,0.55)">NAME</span><span aria-hidden="true" style="color: #FF3B62; font-weight: 700">*</span></span>
<input type="text" inputmode="text" value="{{name}}" onChange="{{on_name}}" placeholder="e.g. Ridgeline Electric"  style="width: 100%; height: 50px; padding: 0 14px; font-size: 16px; border: 1px solid rgba(7,18,56,0.18); border-radius: 12px; box-sizing: border-box">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="display: flex; align-items: center; gap: 3px; min-height: 13px"><span class="m" style="font-size: 10px; font-weight: 500; letter-spacing: 1.2px; color: rgba(7,18,56,0.55)">PERSON TO ASK FOR</span></span>
<input type="text" inputmode="text" value="{{person}}" onChange="{{on_person}}" placeholder="Optional"  style="width: 100%; height: 50px; padding: 0 14px; font-size: 16px; border: 1px solid rgba(7,18,56,0.18); border-radius: 12px; box-sizing: border-box">
</div>
<div style="display: flex; flex-direction: column; gap: 8px"><span class="m" style="font-size: 10px; font-weight: 500; letter-spacing: 1.2px; color: rgba(7,18,56,0.55)">WHAT THEY DO</span><div role="radiogroup" style="display: flex; gap: 6px; flex-wrap: wrap"><sc-for list="{{cats}}" as="c" hint-placeholder-count="6"><button type="button" role="radio" aria-checked="{{c.on}}" onClick="{{c.pick}}" style="{{c.style}}">{{c.l}}</button></sc-for></div></div>
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="display: flex; align-items: center; gap: 3px; min-height: 13px"><span class="m" style="font-size: 10px; font-weight: 500; letter-spacing: 1.2px; color: rgba(7,18,56,0.55)">PHONE</span><span aria-hidden="true" style="color: #FF3B62; font-weight: 700">*</span></span>
<input type="text" inputmode="tel" value="{{phone}}" onChange="{{on_phone}}" placeholder="(256) 555-0100" aria-required="true" style="width: 100%; height: 50px; padding: 0 14px; font-size: 16px; border: 1px solid rgba(7,18,56,0.18); border-radius: 12px; box-sizing: border-box">
<span class="m" style="font-size: 10px; font-weight: 500; letter-spacing: 0.3px; line-height: 1.35; color: rgba(7,18,56,0.45)">{{phoneHelp}}</span></div>
<button type="button" style="align-self: flex-start; display: flex; align-items: center; gap: 6px; min-height: 36px; font-size: 14px; font-weight: 600; color: #2540D8"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#2540D8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5l0 14"></path><path d="M5 12l14 0"></path></svg>Add an after-hours number</button>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="display: flex; align-items: center; gap: 3px; min-height: 13px"><span class="m" style="font-size: 10px; font-weight: 500; letter-spacing: 1.2px; color: rgba(7,18,56,0.55)">EMAIL</span></span>
<input type="text" inputmode="email" value="{{email}}" onChange="{{on_email}}" placeholder="Optional"  style="width: 100%; height: 50px; padding: 0 14px; font-size: 16px; border: 1px solid rgba(7,18,56,0.18); border-radius: 12px; box-sizing: border-box">
</div>
<div style="border: 1px solid rgba(7,18,56,0.12); border-radius: 16px; overflow: hidden"><div style="display: flex; align-items: center; gap: 12px; padding: 10px 14px; min-height: 60px; box-sizing: border-box"><span style="flex: 1; display: flex; flex-direction: column; gap: 3px"><span style="font-size: 15px; font-weight: 600">Answers 24/7</span><span class="m" style="font-size: 10px; font-weight: 500; letter-spacing: 0.3px; line-height: 1.3; color: rgba(7,18,56,0.55)">SHOWS A 24/7 TAG</span></span><button type="button" role="switch" aria-checked="{{emerg}}" aria-label="Answers 24/7" onClick="{{flip_emerg}}" style="{{emergTrack}}"><span style="{{emergKnob}}"></span></button></div><div style="border-top: 0.5px solid rgba(7,18,56,0.12)"><div style="display: flex; align-items: center; gap: 12px; padding: 10px 14px; min-height: 60px; box-sizing: border-box"><span style="flex: 1; display: flex; flex-direction: column; gap: 3px"><span style="font-size: 15px; font-weight: 600">Pin to the Emergency page</span><span class="m" style="font-size: 10px; font-weight: 500; letter-spacing: 0.3px; line-height: 1.3; color: rgba(7,18,56,0.55)">UP TO 3 PINNED · 2 USED</span></span><button type="button" role="switch" aria-checked="{{pin}}" aria-label="Pin to the Emergency page" onClick="{{flip_pin}}" style="{{pinTrack}}"><span style="{{pinKnob}}"></span></button></div></div></div>
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="display: flex; align-items: center; gap: 3px; min-height: 13px"><span class="m" style="font-size: 10px; font-weight: 500; letter-spacing: 1.2px; color: rgba(7,18,56,0.55)">NOTES</span></span>
<textarea rows="3" value="{{notes}}" onChange="{{on_notes}}" placeholder="License number, callout fee, gate code…" style="width: 100%; padding: 12px 14px; font-size: 16px; line-height: 1.4; border: 1px solid rgba(7,18,56,0.18); border-radius: 12px; box-sizing: border-box"></textarea>
<span class="m" style="font-size: 10px; font-weight: 500; letter-spacing: 0.3px; line-height: 1.35; color: rgba(7,18,56,0.45)">NOTES ARE SAVED ON YOUR PHONE TOO</span></div>
<span class="m" style="text-align: center; font-size: 10px; font-weight: 500; letter-spacing: 0.3px; line-height: 1.35; color: rgba(7,18,56,0.45)">6 OF 10 CONTACTS ON FREE</span>
</div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const chips = (key, opts, cur) => opts.map(([k, l]) => ({ l, on: cur === k, pick: () => this.setState({ [key]: k }), style: 'height: 36px; padding: 0 12px; border-radius: 999px; font-size: 13.5px; font-weight: 600; box-sizing: border-box; ' + (cur === k ? 'background: #071238; color: #FFFFFF;' : 'border: 1px solid rgba(7,18,56,0.18); color: rgba(7,18,56,0.75);') }));
    const sw = (on) => 'width: 51px; height: 31px; border-radius: 999px; position: relative; flex-shrink: 0; transition: background .15s; background: ' + (on ? '#2540D8' : 'rgba(7,18,56,0.16)') + ';';
    const kn = (on) => 'position: absolute; top: 2px; left: ' + (on ? 22 : 2) + 'px; width: 27px; height: 27px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 2px 4px rgba(7,18,56,0.25); transition: left .15s;';

    const v = (k, d) => st[k] !== undefined ? st[k] : d;
    const out = {};
    ['name', 'person', 'phone', 'email', 'notes'].forEach((k) => { out[k] = v(k, k === 'name' ? 'Ridgeline Electric' : (k === 'phone' ? '256555017' : '')); out['on_' + k] = (e) => this.setState({ [k]: e.target.value }); });
    const digits = out.phone.replace(/\D/g, '');
    const ok = digits.length === 10;
    out.phoneHelp = !digits.length ? '' : (ok ? 'LOOKS GOOD' : 'NEEDS 10 DIGITS · ' + digits.length + ' SO FAR');
    out.cats = chips('cat', [['plumber', 'Plumber'], ['electric', 'Electrician'], ['hvac', 'HVAC'], ['utility', 'Utility'], ['insurance', 'Insurance'], ['contractor', 'Contractor'], ['other', 'Other']], v('cat', 'electric'));
    [['emerg', false], ['pin', true]].forEach(([k, d]) => { const on = v(k, d); out[k] = on; out['flip_' + k] = () => this.setState({ [k]: !on }); out[k + 'Track'] = sw(on); out[k + 'Knob'] = kn(on); });
    out.ready = !!out.name.trim() && ok; out.notReady = !out.ready;
    return out;
  }
}
</script>
</body>
</html>
