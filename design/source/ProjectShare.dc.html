<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Keystona ProjectShare</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.m{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;border:0;background:none;padding:0;margin:0;cursor:pointer;text-align:left}
a{color:#071238;text-decoration:none}a:hover{color:#2540D8}
@keyframes kpulse{0%{box-shadow:0 0 0 0 rgba(255,59,98,.5)}70%{box-shadow:0 0 0 6px rgba(255,59,98,0)}100%{box-shadow:0 0 0 0 rgba(255,59,98,0)}}
.pulse{animation:kpulse 1.8s infinite}
input,textarea{font:inherit;color:#071238}
input::placeholder,textarea::placeholder{color:rgba(7,18,56,0.35)}
input:focus,textarea:focus{outline:none}
textarea{resize:none}
select{appearance:none;-webkit-appearance:none;background:transparent;border:0;font:inherit;color:#071238}select:focus{outline:none}
input[type=time]::-webkit-calendar-picker-indicator{opacity:0.5}
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
textarea{font:inherit;color:#071238;resize:none}textarea:focus{outline:none}textarea::placeholder{color:rgba(7,18,56,0.35)}input::placeholder{color:rgba(7,18,56,0.35)}.sb>*{flex-shrink:0}
</style>
</helmet>
<div style="width: 390px; height: 900px; box-sizing: border-box; background: #FFFFFF; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; color: #071238; position: relative; overflow: hidden">
<div aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none"><dc-import name="ProjectDone" hint-size="390px,1440px"></dc-import></div>
<a href="ProjectDone.dc.html" aria-label="Close" style="position: absolute; inset: 0; background: rgba(7,18,56,0.45)"></a>
<section role="dialog" aria-label="Share this project" style="position: absolute; left: 0; right: 0; top: 110px; bottom: 0; background: #FFFFFF; border-radius: 22px 22px 0 0; display: flex; flex-direction: column">
<span aria-hidden="true" style="align-self: center; margin-top: 8px; width: 36px; height: 4px; border-radius: 3px; background: rgba(7,18,56,0.2)"></span>
<div style="display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; padding: 6px 16px 10px; border-bottom: 0.5px solid rgba(7,18,56,0.12)">
<a href="ProjectDone.dc.html" style="justify-self: start; display: flex; align-items: center; min-height: 44px; font-size: 15px; font-weight: 500; color: rgba(7,18,56,0.6)">Cancel</a>
<h1 style="margin: 0; font-size: 16px; font-weight: 700">Share this project</h1>
<span style="justify-self: end"><sc-if value="{{notReady}}" hint-placeholder-val="{{ true }}"><span aria-disabled="true" style="display: flex; align-items: center; height: 36px; padding: 0 16px; border-radius: 999px; background: rgba(7,18,56,0.08); color: rgba(7,18,56,0.35); font-size: 14px; font-weight: 600">Save</span></sc-if></span>
</div>
<div class="sb" style="flex: 1; min-height: 0; overflow-y: auto; padding: 16px 16px 30px; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; align-items: center; gap: 12px"><div style="width: 64px; flex-shrink: 0"><div style="position: relative; aspect-ratio: 1; border-radius: 12px; overflow: hidden; border: 1px solid rgba(37,64,216,0.25); background-image: linear-gradient(rgba(37,64,216,0.11) 1px, transparent 1px), linear-gradient(90deg, rgba(37,64,216,0.11) 1px, transparent 1px); background-size: 10px 10px; background-position: -1px -1px"></div></div><span style="flex: 1; display: flex; flex-direction: column; gap: 3px"><span style="font-size: 17px; font-weight: 800; letter-spacing: -0.3px">Guest bath refresh</span><span class="m" style="font-size: 10px; font-weight: 500; letter-spacing: 0.3px; line-height: 1.3; color: rgba(7,18,56,0.55)">FINISHED MAY 24 · $2,240 · 31 PHOTOS</span></span></div>
<div role="radiogroup" aria-label="Share as" style="display: flex; flex-direction: column; gap: 8px"><sc-for list="{{ways}}" as="w" hint-placeholder-count="3"><button type="button" role="radio" aria-checked="{{w.on}}" onClick="{{w.pick}}" style="{{w.box}}"><span style="{{w.radio}}"><span style="{{w.dot}}"></span></span><span style="flex: 1; display: flex; flex-direction: column; gap: 3px; text-align: left"><span style="font-size: 15px; font-weight: 700">{{w.l}}</span><span style="font-size: 13px; line-height: 1.4; color: rgba(7,18,56,0.6)">{{w.sub}}</span></span></button></sc-for></div>
<sc-if value="{{isPage}}" hint-placeholder-val="{{ true }}"><div style="display: flex; flex-direction: column; gap: 8px"><span class="m" style="font-size: 10px; font-weight: 500; letter-spacing: 1.2px; color: rgba(7,18,56,0.55)">SHOW</span><div style="border: 1px solid rgba(7,18,56,0.12); border-radius: 16px; overflow: hidden"><sc-for list="{{shows}}" as="r" hint-placeholder-count="3"><div style="{{r.row}}"><span style="flex: 1; display: flex; flex-direction: column; gap: 3px"><span style="font-size: 15px; font-weight: 600">{{r.t}}</span><span class="m" style="font-size: 10px; font-weight: 500; letter-spacing: 0.3px; line-height: 1.3; color: rgba(7,18,56,0.55)">{{r.sub}}</span></span><button type="button" role="switch" aria-checked="{{r.on}}" aria-label="{{r.t}}" onClick="{{r.flip}}" style="{{r.track}}"><span style="{{r.knob}}"></span></button></div></sc-for></div></div></sc-if>
<sc-if value="{{isReport}}" hint-placeholder-val="{{ false }}"><div style="display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 14px; border: 1.5px solid #4A6604"><span style="width: 22px; height: 22px; border-radius: 50%; background: #4A6604; color: #ECF87F; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5l10-10"></path></svg></span><span style="font-size: 13.5px; line-height: 1.45; color: rgba(7,18,56,0.75)">It&rsquo;s already in your Home History Report. Anyone with your report link sees it on page 3, under Improvements.</span></div></sc-if>
<a href="{{ctaHref}}" style="height: 54px; border-radius: 999px; background: #2540D8; color: #FFFFFF; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8.7 10.7l6.6-3.4"></path><path d="M8.7 13.3l6.6 3.4"></path><path d="M6 12m-3 0a3 3 0 1 0 6 0a3 3 0 1 0-6 0"></path><path d="M18 6m-3 0a3 3 0 1 0 6 0a3 3 0 1 0-6 0"></path><path d="M18 18m-3 0a3 3 0 1 0 6 0a3 3 0 1 0-6 0"></path></svg>{{cta}}</a>
</div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const chips = (key, opts, cur) => opts.map(([k, l]) => ({ l, on: cur === k, pick: () => this.setState({ [key]: k }), style: 'height: 36px; padding: 0 12px; border-radius: 999px; font-size: 13.5px; font-weight: 600; box-sizing: border-box; ' + (cur === k ? 'background: #071238; color: #FFFFFF;' : 'border: 1px solid rgba(7,18,56,0.18); color: rgba(7,18,56,0.75);') }));
    const sw = (on) => 'width: 51px; height: 31px; border-radius: 999px; position: relative; flex-shrink: 0; transition: background .15s; background: ' + (on ? '#2540D8' : 'rgba(7,18,56,0.16)') + ';';
    const kn = (on) => 'position: absolute; top: 2px; left: ' + (on ? 22 : 2) + 'px; width: 27px; height: 27px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 2px 4px rgba(7,18,56,0.25); transition: left .15s;';

    const w = st.w || 'page';
    const W = [['page', 'Just this project', 'A one-page link you can send to anyone'], ['pair', 'The before & after photo', 'One image with the badges, ready for anywhere'], ['report', 'In my Home History Report', 'One short entry on the Improvements page']];
    const sh = st.sh || {};
    const SH = [['cost', 'What it cost', 'TOTAL ONLY · $2,240', false], ['who', 'Who did the work', 'RIDGELINE ELECTRIC · YOU + ALEX', true], ['notes', 'My “next time” notes', 'HIDDEN BY DEFAULT', false]];
    return {
      ways: W.map(([k, l, sub]) => ({ l, sub, on: w === k, pick: () => this.setState({ w: k }),
        box: 'width: 100%; display: flex; align-items: flex-start; gap: 12px; padding: 12px 14px; border-radius: 14px; box-sizing: border-box; ' + (w === k ? 'box-shadow: inset 0 0 0 2px #071238;' : 'box-shadow: inset 0 0 0 1px rgba(7,18,56,0.14);'),
        radio: 'width: 22px; height: 22px; border-radius: 50%; box-sizing: border-box; flex-shrink: 0; margin-top: 1px; display: flex; align-items: center; justify-content: center; ' + (w === k ? 'border: 2px solid #071238;' : 'border: 1.5px solid rgba(7,18,56,0.3);'),
        dot: w === k ? 'width: 10px; height: 10px; border-radius: 50%; background: #071238;' : 'display: none;' })),
      isPage: w === 'page', isReport: w === 'report',
      shows: SH.map(([k, t, sub, d], i) => { const o = sh[k] !== undefined ? sh[k] : d; return { t, sub, on: o, flip: () => this.setState({ sh: Object.assign({}, sh, { [k]: !o }) }), track: sw(o), knob: kn(o),
        row: 'display: flex; align-items: center; gap: 12px; padding: 10px 14px; min-height: 58px; box-sizing: border-box; ' + (i ? 'border-top: 0.5px solid rgba(7,18,56,0.12);' : '') }; }),
      cta: { page: 'Copy link', pair: 'Share image', report: 'Open the report' }[w],
      ctaHref: w === 'report' ? 'ReportPreview.dc.html' : '#',
      ready: false, notReady: false
    };
  }
}
</script>
</body>
</html>
