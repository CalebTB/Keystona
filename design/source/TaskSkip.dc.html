<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Keystona TaskSkip</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.m{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;border:0;background:none;padding:0;margin:0;cursor:pointer;text-align:left}
a{color:#071238;text-decoration:none}a:hover{color:#2540D8}
@keyframes kpulse{0%{box-shadow:0 0 0 0 rgba(255,59,98,.5)}70%{box-shadow:0 0 0 6px rgba(255,59,98,0)}100%{box-shadow:0 0 0 0 rgba(255,59,98,0)}}
.pulse{animation:kpulse 1.8s infinite}
input,textarea{font:inherit;color:#071238}
input::placeholder,textarea::placeholder{color:rgba(7,18,56,0.35)}
input:focus,textarea:focus{outline:none}
textarea{resize:none}
select{appearance:none;-webkit-appearance:none;background:transparent;border:0;font:inherit;color:#071238}select:focus{outline:none}
input[type=time]::-webkit-calendar-picker-indicator{opacity:0.5}
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
textarea{font:inherit;color:#071238;resize:none}textarea:focus{outline:none}textarea::placeholder{color:rgba(7,18,56,0.35)}input::placeholder{color:rgba(7,18,56,0.35)}.sb>*{flex-shrink:0}
</style>
</helmet>
<div style="width: 390px; height: 960px; box-sizing: border-box; background: #FFFFFF; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; color: #071238; position: relative; overflow: hidden">
<div aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none"><dc-import name="TaskDetail" hint-size="390px,1900px"></dc-import></div>
<a href="TaskDetail.dc.html" aria-label="Close" style="position: absolute; inset: 0; background: rgba(7,18,56,0.45)"></a>
<section role="dialog" aria-label="Not now?" style="position: absolute; left: 0; right: 0; top: 120px; bottom: 0; background: #FFFFFF; border-radius: 22px 22px 0 0; display: flex; flex-direction: column">
<span aria-hidden="true" style="align-self: center; margin-top: 8px; width: 36px; height: 4px; border-radius: 3px; background: rgba(7,18,56,0.2)"></span>
<div style="display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; padding: 6px 16px 10px; border-bottom: 0.5px solid rgba(7,18,56,0.12)">
<a href="TaskDetail.dc.html" style="justify-self: start; display: flex; align-items: center; min-height: 44px; font-size: 15px; font-weight: 500; color: rgba(7,18,56,0.6)">Cancel</a>
<h1 style="margin: 0; font-size: 16px; font-weight: 700">Not now?</h1>
<span style="justify-self: end"><sc-if value="{{notReady}}" hint-placeholder-val="{{ true }}"><span aria-disabled="true" style="display: flex; align-items: center; height: 36px; padding: 0 16px; border-radius: 999px; background: rgba(7,18,56,0.08); color: rgba(7,18,56,0.35); font-size: 14px; font-weight: 600">Save</span></sc-if></span>
</div>
<div class="sb" style="flex: 1; min-height: 0; overflow-y: auto; padding: 16px 16px 30px; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 19px; font-weight: 800; letter-spacing: -0.4px">Replace HVAC air filter</span><span class="m" style="font-size: 10px; font-weight: 500; letter-spacing: 0.3px; line-height: 1.3; color: rgba(7,18,56,0.55)">DUE WED, OCT 7 · EVERY 3 MONTHS</span></div>
<div role="radiogroup" aria-label="Why" style="display: flex; flex-direction: column; gap: 8px"><sc-for list="{{reasons}}" as="r" hint-placeholder-count="4"><button type="button" role="radio" aria-checked="{{r.on}}" onClick="{{r.pick}}" style="{{r.box}}"><span style="{{r.radio}}"><span style="{{r.dot}}"></span></span><span style="flex: 1; display: flex; flex-direction: column; gap: 3px; text-align: left"><span style="font-size: 15.5px; font-weight: 700">{{r.l}}</span><span style="font-size: 13px; line-height: 1.4; color: rgba(7,18,56,0.6)">{{r.sub}}</span></span></button></sc-for></div>
<sc-if value="{{isLater}}" hint-placeholder-val="{{ false }}"><div style="display: flex; flex-direction: column; gap: 8px"><span class="m" style="font-size: 10px; font-weight: 500; letter-spacing: 1.2px; color: rgba(7,18,56,0.55)">REMIND ME</span><div role="radiogroup" style="display: flex; gap: 6px; flex-wrap: wrap"><sc-for list="{{laters}}" as="c" hint-placeholder-count="6"><button type="button" role="radio" aria-checked="{{c.on}}" onClick="{{c.pick}}" style="{{c.style}}">{{c.l}}</button></sc-for></div></div></sc-if>
<sc-if value="{{isOther}}" hint-placeholder-val="{{ false }}"><div style="display: flex; flex-direction: column; gap: 8px"><span class="m" style="font-size: 10px; font-weight: 500; letter-spacing: 1.2px; color: rgba(7,18,56,0.55)">WHO DID IT</span><div role="radiogroup" style="display: flex; gap: 6px; flex-wrap: wrap"><sc-for list="{{others}}" as="c" hint-placeholder-count="6"><button type="button" role="radio" aria-checked="{{c.on}}" onClick="{{c.pick}}" style="{{c.style}}">{{c.l}}</button></sc-for></div></div></sc-if>
<div style="display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 14px; border: 1px solid rgba(7,18,56,0.12)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="rgba(7,18,56,0.6)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 12l5 5l10-10"></path><path d="M2 12l5 5m5-5l5-5"></path></svg><span style="font-size: 13.5px; line-height: 1.45; color: rgba(7,18,56,0.75)">{{result}}</span></div>
<button type="button" style="{{ctaStyle}}">{{cta}}</button>
</div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":960}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const chips = (key, opts, cur) => opts.map(([k, l]) => ({ l, on: cur === k, pick: () => this.setState({ [key]: k }), style: 'height: 36px; padding: 0 12px; border-radius: 999px; font-size: 13.5px; font-weight: 600; box-sizing: border-box; ' + (cur === k ? 'background: #071238; color: #FFFFFF;' : 'border: 1px solid rgba(7,18,56,0.18); color: rgba(7,18,56,0.75);') }));
    const sw = (on) => 'width: 51px; height: 31px; border-radius: 999px; position: relative; flex-shrink: 0; transition: background .15s; background: ' + (on ? '#2540D8' : 'rgba(7,18,56,0.16)') + ';';
    const kn = (on) => 'position: absolute; top: 2px; left: ' + (on ? 22 : 2) + 'px; width: 27px; height: 27px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 2px 4px rgba(7,18,56,0.25); transition: left .15s;';

    const r = st.r || 'later';
    const R = [['later', 'I’ll do it later', 'Push it back. It stays on your list.'], ['other', 'Someone else did it', 'Log it as done so the next one is scheduled right.'], ['na', 'Doesn’t apply to my home', 'Stop reminding me about this one.'], ['skip', 'Just skip this one', 'Nothing logged. The next one comes in January.']];
    const later = st.later || '1w', other = st.other || 'alex';
    const LT = { '1w': 'next Wednesday, Oct 14', '2w': 'Wednesday, Oct 21', '1m': 'Friday, Nov 6' };
    const res = { later: 'Moves to ' + LT[later] + '. Home Health doesn’t drop while it’s pushed back.',
      other: 'Logged as done today by ' + (other === 'alex' ? 'Alex' : (other === 'pro' ? 'a pro' : 'someone else')) + '. Next one is due Jan 4, 2027.',
      na: 'Turned off for the furnace. It stops counting toward Home Health. Turn it back on any time in Furnace → Manage.',
      skip: 'Marked skipped. The next one is due Jan 4, 2027 — a skipped one counts lightly against Home Health.' }[r];
    const cta = { later: 'Push it back', other: 'Log it as done', na: 'Stop reminding me', skip: 'Skip this one' }[r];
    return {
      reasons: R.map(([k, l, sub]) => ({ l, sub, on: r === k, pick: () => this.setState({ r: k }),
        box: 'width: 100%; display: flex; align-items: flex-start; gap: 12px; padding: 14px; border-radius: 16px; box-sizing: border-box; ' + (r === k ? 'box-shadow: inset 0 0 0 2px #071238;' : 'box-shadow: inset 0 0 0 1px rgba(7,18,56,0.14);'),
        radio: 'width: 22px; height: 22px; border-radius: 50%; box-sizing: border-box; flex-shrink: 0; margin-top: 1px; display: flex; align-items: center; justify-content: center; ' + (r === k ? 'border: 2px solid #071238;' : 'border: 1.5px solid rgba(7,18,56,0.3);'),
        dot: r === k ? 'width: 10px; height: 10px; border-radius: 50%; background: #071238;' : 'display: none;' })),
      isLater: r === 'later', isOther: r === 'other',
      laters: chips('later', [['1w', '1 week'], ['2w', '2 weeks'], ['1m', '1 month']], later),
      others: chips('other', [['alex', 'Alex'], ['pro', 'A pro'], ['else', 'Someone else']], other),
      result: res, cta,
      ctaStyle: 'height: 54px; border-radius: 999px; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center; ' + (r === 'na' ? 'background: #FF3B62; color: #FFFFFF;' : 'background: #2540D8; color: #FFFFFF;'),
      ready: false, notReady: false
    };
  }
}
</script>
</body>
</html>
