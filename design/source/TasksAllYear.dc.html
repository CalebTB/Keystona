<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1180}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const flips = st.flips || {};
    const flip = (id) => () => this.setState({ flips: Object.assign({}, flips, { [id]: !flips[id] }) });
    const MON = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
    const MONTH = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    // y, m (0-11), d
    const T = [
      { id: 'gutter', name: 'Clean gutters & downspouts', meta: 'EXTERIOR · 45 MIN · DIY OR PRO', sys: 'ext', y: 2026, m: 8, d: 28, late: '6 DAYS LATE' },
      { id: 'smoke', name: 'Test smoke & CO detectors', meta: 'SAFETY · 10 MIN · DIY', sys: 'safety', y: 2026, m: 9, d: 4 },
      { id: 'hvac', name: 'Replace HVAC air filter', meta: 'HVAC · 15 MIN · $25', sys: 'hvac', y: 2026, m: 9, d: 7 },
      { id: 'flush', name: 'Flush water heater sediment', meta: 'PLUMBING · 45 MIN', sys: 'plumb', y: 2026, m: 9, d: 13 },
      { id: 'grout', name: 'Choose grout color', meta: 'BATH RENO PROJECT', sys: 'proj', y: 2026, m: 9, d: 16 },
      { id: 'roof', name: 'Inspect roof flashing', meta: 'ROOF · 1 HR', chip: 'PRO', sys: 'roof', y: 2026, m: 9, d: 25 },
      { id: 'furnace', name: 'Service the furnace', meta: 'HVAC · FALL PREP', chip: 'PRO', sys: 'hvac', y: 2026, m: 9, d: 28 },
      { id: 'faucets', name: 'Shut off & drain outdoor faucets', meta: 'PLUMBING · WINTER PREP', sys: 'plumb', y: 2026, m: 10, d: 2 },
      { id: 'dryer', name: 'Clean dryer vent', meta: 'APPLIANCES · 30 MIN', sys: 'appl', y: 2026, m: 10, d: 9 },
      { id: 'sump', name: 'Test sump pump', meta: 'PLUMBING · 10 MIN', sys: 'plumb', y: 2026, m: 10, d: 14 },
      { id: 'fans', name: 'Reverse ceiling fans', meta: 'HVAC · 10 MIN', sys: 'hvac', y: 2026, m: 10, d: 20 },
      { id: 'weather', name: 'Check door weatherstripping', meta: 'EXTERIOR · 20 MIN', sys: 'ext', y: 2026, m: 10, d: 24 },
      { id: 'hvac2', name: 'Replace HVAC air filter', meta: 'HVAC · 15 MIN · $25', sys: 'hvac', y: 2026, m: 11, d: 7 },
      { id: 'ice', name: 'Check for ice dams', meta: 'ROOF · AFTER SNOW', sys: 'roof', y: 2026, m: 11, d: 15 },
      { id: 'ext', name: 'Inspect fire extinguisher', meta: 'SAFETY · 5 MIN', sys: 'safety', y: 2026, m: 11, d: 20 },
      { id: 'gfci', name: 'Test GFCI outlets', meta: 'ELECTRICAL · 15 MIN', sys: 'elec', y: 2027, m: 0, d: 10 },
      { id: 'hood', name: 'Clean range hood filter', meta: 'APPLIANCES · 20 MIN', sys: 'appl', y: 2027, m: 0, d: 18 },
      { id: 'hvac3', name: 'Replace HVAC air filter', meta: 'HVAC · 15 MIN · $25', sys: 'hvac', y: 2027, m: 1, d: 7 },
      { id: 'attic', name: 'Check attic for leaks', meta: 'ROOF · 20 MIN', sys: 'roof', y: 2027, m: 1, d: 21 },
      { id: 'roof2', name: 'Inspect roof after winter', meta: 'ROOF · 1 HR', chip: 'PRO', sys: 'roof', y: 2027, m: 2, d: 15 },
      { id: 'screens', name: 'Clean window screens', meta: 'EXTERIOR · 1 HR', sys: 'ext', y: 2027, m: 2, d: 28 },
      { id: 'ac', name: 'Service the AC', meta: 'HVAC · SPRING PREP', chip: 'PRO', sys: 'hvac', y: 2027, m: 3, d: 8 },
      { id: 'gutter2', name: 'Clean gutters & downspouts', meta: 'EXTERIOR · 45 MIN', sys: 'ext', y: 2027, m: 3, d: 19 },
      { id: 'irrig', name: 'Turn on & check irrigation', meta: 'LANDSCAPE · 30 MIN', sys: 'land', y: 2027, m: 3, d: 26 },
      { id: 'hvac4', name: 'Replace HVAC air filter', meta: 'HVAC · 15 MIN · $25', sys: 'hvac', y: 2027, m: 4, d: 7 },
      { id: 'deck', name: 'Seal the deck', meta: 'EXTERIOR · HALF DAY', sys: 'ext', y: 2027, m: 4, d: 16 },
      { id: 'wash', name: 'Power-wash siding', meta: 'EXTERIOR · 2 HR', sys: 'ext', y: 2027, m: 4, d: 30 },
      { id: 'caulk', name: 'Check bathroom caulk', meta: 'PLUMBING · 15 MIN', sys: 'plumb', y: 2027, m: 5, d: 6 },
      { id: 'sump2', name: 'Test sump pump', meta: 'PLUMBING · 10 MIN', sys: 'plumb', y: 2027, m: 5, d: 14 },
      { id: 'termite', name: 'Termite inspection', meta: 'STRUCTURE · YEARLY', chip: 'PRO', sys: 'struct', y: 2027, m: 6, d: 12 },
      { id: 'hvac5', name: 'Replace HVAC air filter', meta: 'HVAC · 15 MIN · $25', sys: 'hvac', y: 2027, m: 7, d: 7 },
      { id: 'coils', name: 'Clean refrigerator coils', meta: 'APPLIANCES · 20 MIN', sys: 'appl', y: 2027, m: 7, d: 23 },
      { id: 'flush2', name: 'Flush water heater sediment', meta: 'PLUMBING · 45 MIN', sys: 'plumb', y: 2027, m: 8, d: 12 },
      { id: 'chimney', name: 'Chimney sweep', meta: 'FIREPLACE · YEARLY', chip: 'PRO', sys: 'fire', y: 2027, m: 8, d: 26 }
    ];
    const TODAY = { y: 2026, m: 9, d: 4 };
    const short = (t) => (t.y === TODAY.y && t.m === TODAY.m && t.d === TODAY.d) ? 'TODAY' : MON[t.m] + ' ' + t.d;
    const chipBase = 'display: flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 999px; font-size: 9px; font-weight: 600; letter-spacing: 0.8px; flex-shrink: 0;';
    const row = (t, i, opt) => {
      opt = opt || {};
      const d = !!flips[t.id];
      let chip = '', chipStyle = '';
      if (t.late && !d) { chip = t.late; chipStyle = chipBase + ' background: #FF3B62; color: #FFFFFF; font-weight: 700;'; }
      else if (t.chip && !d) { chip = t.chip; chipStyle = chipBase + ' border: 1px solid rgba(7,18,56,0.16); color: rgba(7,18,56,0.55);'; }
      let circle = 'width: 24px; height: 24px; border-radius: 50%; box-sizing: border-box; display: flex; align-items: center; justify-content: center; ';
      if (d) circle += 'background: #4A6604; border: 1.5px solid #4A6604; color: #ECF87F;';
      else if (t.late) circle += 'border: 1.5px solid #FF3B62;';
      else circle += 'border: 1.5px solid rgba(7,18,56,0.3);';
      const date = d ? 'DONE' : (t.late || opt.noDate ? '' : short(t));
      return {
        name: t.name, meta: opt.meta ? opt.meta(t) : t.meta, date, hasDate: !!date,
        hasChip: !!chip, chip, chipStyle, done: d,
        href: t.id === 'hvac' ? 'TaskDetail.dc.html' : '#',
        checkLabel: (d ? 'Mark not done: ' : 'Mark done: ') + t.name,
        toggle: () => { if (this._moved) return; flip(t.id)(); }, circleStyle: circle,
        titleStyle: 'font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; ' + (d ? 'text-decoration: line-through; color: rgba(7,18,56,0.45);' : ''),
        sep: i === 0 ? '' : 'border-top: 0.5px solid rgba(7,18,56,0.12);'
      };
    };
    const late = T.filter(t => t.late);
    const upcoming = T.filter(t => !t.late);
    const left = T.filter(t => !flips[t.id]).length;
    const lateRows = late.map((t, i) => row(t, i));
    const hasLate = true;

    const MONTHS = [];
    for (let i = 0; i < 12; i++) { const m = (9 + i) % 12; MONTHS.push({ y: m >= 9 ? 2026 : 2027, m }); }
    const mi = st.mi || 0;
    const counts = MONTHS.map(c => upcoming.filter(t => t.y === c.y && t.m === c.m));
    const max = Math.max.apply(null, counts.map(c => c.length));
    const bars = MONTHS.map((c, i) => {
      const ts = counts[i];
      const leftN = ts.filter(t => !flips[t.id]).length;
      const sel = i === mi;
      const allDone = ts.length && leftN === 0;
      const h = Math.max(6, Math.round(64 * ts.length / max));
      let bar = 'width: 16px; height: ' + h + 'px; border-radius: 5px; box-sizing: border-box; ';
      if (sel) bar += 'background: #071238;';
      else if (allDone) bar += 'background: #4A6604;';
      else bar += 'border: 1.5px solid rgba(7,18,56,0.3);';
      return {
        sel, count: String(ts.length),
        aria: MONTH[c.m] + ' ' + c.y + ', ' + ts.length + ' tasks',
        pick: () => { if (this._moved) return; this.setState({ mi: i, dx: 0 }); },
        barStyle: bar,
        countStyle: 'font-size: 10px; font-weight: ' + (sel ? 700 : 500) + '; color: ' + (sel ? '#071238' : 'rgba(7,18,56,0.45)') + ';',
        labelStyle: 'font-size: 10px; font-weight: ' + (sel ? 700 : 500) + '; color: ' + (sel ? '#071238' : 'rgba(7,18,56,0.55)') + ';',
        label: MON[c.m].charAt(0)
      };
    });
    // ---- swipe between months ----
    const STEP = 390; // page width 358 + 32 gap
    const go = (n) => { n = Math.max(0, Math.min(11, n)); this.setState({ mi: n, dx: 0, dragging: false }); };
    const dx = st.dx || 0;
    const dragging = !!st.dragging;
    const onDown = (e) => { this._x0 = e.clientX; this._y0 = e.clientY; this._down = true; this._moved = false; };
    const onMove = (e) => {
      if (!this._down) return;
      let d = e.clientX - this._x0;
      const dy = e.clientY - this._y0;
      if (!this._moved) {
        if (Math.abs(d) < 8 || Math.abs(d) < Math.abs(dy)) return;
        this._moved = true;
        try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) {}
      }
      if ((mi === 0 && d > 0) || (mi === 11 && d < 0)) d = d / 3;
      this.setState({ dx: d, dragging: true });
    };
    const onUp = () => {
      if (!this._down) return;
      this._down = false;
      if (this._moved) {
        const d = (this.state && this.state.dx) || 0;
        go(d < -50 ? mi + 1 : d > 50 ? mi - 1 : mi);
        setTimeout(() => { this._moved = false; }, 0);
      }
    };
    const onWheel = (e) => {
      if (Math.abs(e.deltaX) <= Math.abs(e.deltaY)) return;
      const now = Date.now();
      if (this._wheelLock && now < this._wheelLock) return;
      this._wheelAcc = (this._wheelAcc || 0) + e.deltaX;
      if (Math.abs(this._wheelAcc) > 40) { go(mi + (this._wheelAcc > 0 ? 1 : -1)); this._wheelAcc = 0; this._wheelLock = now + 450; }
    };
    const pages = MONTHS.map((c, i) => {
      const ts = counts[i];
      const pros = ts.filter(t => t.chip === 'PRO').length;
      const doneN = ts.filter(t => flips[t.id]).length;
      return {
        title: MONTH[c.m] + ' ' + c.y,
        aria: MONTH[c.m] + ' ' + c.y + ', ' + (i + 1) + ' of 12',
        hidden: i !== mi,
        meta: ts.length + ' TASKS · ' + (pros ? pros + (pros === 1 ? ' NEEDS A PRO' : ' NEED A PRO') : 'ALL DIY') + (doneN ? ' · ' + doneN + ' DONE' : ''),
        rows: ts.map((t, k) => row(t, k))
      };
    });
    const prevM = mi > 0 ? MONTH[MONTHS[mi - 1].m] : null;
    const nextM = mi < 11 ? MONTH[MONTHS[mi + 1].m] : null;
    return {
      eyebrow: 'NEXT 12 MONTHS · ' + left + ' TASKS',
      hasLate, lateRows, bars, pages,
      onDown, onMove, onUp, onWheel,
      noDrag: (e) => e.preventDefault(),
      trackStyle: 'display: flex; align-items: flex-start; gap: 32px; will-change: transform; transform: translateX(' + (-mi * STEP + dx) + 'px); transition: ' + (dragging ? 'none' : 'transform .32s cubic-bezier(.2,.8,.2,1)') + ';',
      swipeHint: (prevM && nextM) ? 'SWIPE FOR ' + prevM.toUpperCase() + ' OR ' + nextM.toUpperCase() : 'SWIPE FOR ' + (nextM || prevM).toUpperCase()
    };
  }
}
</script>
</body>
