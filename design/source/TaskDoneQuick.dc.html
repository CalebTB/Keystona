<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Keystona TaskDoneQuick</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.m{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;border:0;background:none;padding:0;margin:0;cursor:pointer;text-align:left}
a{color:#071238;text-decoration:none}a:hover{color:#2540D8}
@keyframes kpulse{0%{box-shadow:0 0 0 0 rgba(255,59,98,.5)}70%{box-shadow:0 0 0 6px rgba(255,59,98,0)}100%{box-shadow:0 0 0 0 rgba(255,59,98,0)}}
.pulse{animation:kpulse 1.8s infinite}
input,textarea{font:inherit;color:#071238}
input::placeholder,textarea::placeholder{color:rgba(7,18,56,0.35)}
input:focus,textarea:focus{outline:none}
textarea{resize:none}
select{appearance:none;-webkit-appearance:none;background:transparent;border:0;font:inherit;color:#071238}select:focus{outline:none}
input[type=time]::-webkit-calendar-picker-indicator{opacity:0.5}
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
textarea{font:inherit;color:#071238;resize:none}textarea:focus{outline:none}textarea::placeholder{color:rgba(7,18,56,0.35)}input::placeholder{color:rgba(7,18,56,0.35)}.sb>*{flex-shrink:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; color: #071238; position: relative; overflow: hidden">
<div aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none"><dc-import name="Tasks" hint-size="390px,1200px"></dc-import></div>
<a href="Tasks.dc.html" aria-label="Close" style="position: absolute; inset: 0; background: rgba(7,18,56,0.45)"></a>
<section role="dialog" aria-label="Nice — it’s done" style="position: absolute; left: 0; right: 0; top: 300px; bottom: 0; background: #FFFFFF; border-radius: 22px 22px 0 0; display: flex; flex-direction: column">
<span aria-hidden="true" style="align-self: center; margin-top: 8px; width: 36px; height: 4px; border-radius: 3px; background: rgba(7,18,56,0.2)"></span>
<div style="display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; padding: 6px 16px 10px; border-bottom: 0.5px solid rgba(7,18,56,0.12)">
<a href="Tasks.dc.html" style="justify-self: start; display: flex; align-items: center; min-height: 44px; font-size: 15px; font-weight: 500; color: rgba(7,18,56,0.6)">Undo</a>
<h1 style="margin: 0; font-size: 16px; font-weight: 700">Nice — it’s done</h1>
<span style="justify-self: end"><sc-if value="{{ready}}" hint-placeholder-val="{{ true }}"><a href="Tasks.dc.html" style="display: flex; align-items: center; height: 36px; padding: 0 16px; border-radius: 999px; background: #2540D8; color: #FFFFFF; font-size: 14px; font-weight: 600">Save</a></sc-if><sc-if value="{{notReady}}" hint-placeholder-val="{{ true }}"><span aria-disabled="true" style="display: flex; align-items: center; height: 36px; padding: 0 16px; border-radius: 999px; background: rgba(7,18,56,0.08); color: rgba(7,18,56,0.35); font-size: 14px; font-weight: 600">Save</span></sc-if></span>
</div>
<div class="sb" style="flex: 1; min-height: 0; overflow-y: auto; padding: 16px 16px 30px; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; align-items: center; gap: 14px">
<span style="width: 52px; height: 52px; border-radius: 50%; background: #ECF87F; color: #4A6604; border: 1.5px solid #4A6604; box-sizing: border-box; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5l10-10"></path></svg></span>
<span style="flex: 1; display: flex; flex-direction: column; gap: 3px"><span style="font-size: 19px; font-weight: 800; letter-spacing: -0.4px">Replace HVAC air filter</span><span class="m" style="font-size: 10px; font-weight: 700; letter-spacing: 0.6px; color: #4A6604">DONE · MAINT +3 · NEXT ONE JAN 4, 2027</span></span>
</div>
<div style="display: flex; flex-direction: column; gap: 8px"><span class="m" style="font-size: 10px; font-weight: 500; letter-spacing: 1.2px; color: rgba(7,18,56,0.55)">WHEN</span><div role="radiogroup" style="display: flex; gap: 6px; flex-wrap: wrap"><sc-for list="{{whens}}" as="c" hint-placeholder-count="6"><button type="button" role="radio" aria-checked="{{c.on}}" onClick="{{c.pick}}" style="{{c.style}}">{{c.l}}</button></sc-for></div></div>
<div style="display: flex; flex-direction: column; gap: 8px"><span class="m" style="font-size: 10px; font-weight: 500; letter-spacing: 1.2px; color: rgba(7,18,56,0.55)">WHO DID IT</span><div role="radiogroup" style="display: flex; gap: 6px; flex-wrap: wrap"><sc-for list="{{whos}}" as="c" hint-placeholder-count="6"><button type="button" role="radio" aria-checked="{{c.on}}" onClick="{{c.pick}}" style="{{c.style}}">{{c.l}}</button></sc-for></div></div>
<div style="display: grid; grid-template-columns: 1fr 1.4fr; gap: 8px"><div style="display: flex; flex-direction: column; gap: 6px">
<span style="display: flex; align-items: center; gap: 3px; min-height: 13px"><span class="m" style="font-size: 10px; font-weight: 500; letter-spacing: 1.2px; color: rgba(7,18,56,0.55)">COST</span></span>
<input type="text" inputmode="decimal" value="{{cost}}" onChange="{{on_cost}}" placeholder="$0"  style="width: 100%; height: 50px; padding: 0 14px; font-size: 16px; border: 1px solid rgba(7,18,56,0.18); border-radius: 12px; box-sizing: border-box">
<span class="m" style="font-size: 10px; font-weight: 500; letter-spacing: 0.3px; line-height: 1.35; color: rgba(7,18,56,0.45)">{{costHelp}}</span></div><div style="display: flex; flex-direction: column; gap: 6px">
<span style="display: flex; align-items: center; gap: 3px; min-height: 13px"><span class="m" style="font-size: 10px; font-weight: 500; letter-spacing: 1.2px; color: rgba(7,18,56,0.55)">QUICK NOTE</span></span>
<input type="text" inputmode="text" value="{{note}}" onChange="{{on_note}}" placeholder="Optional"  style="width: 100%; height: 50px; padding: 0 14px; font-size: 16px; border: 1px solid rgba(7,18,56,0.18); border-radius: 12px; box-sizing: border-box">
</div></div>
<a href="TaskLog.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; border: 1.5px dashed rgba(7,18,56,0.22)"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#2540D8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 7h1a2 2 0 0 0 2-2a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1a2 2 0 0 0 2 2h1a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-14a2 2 0 0 1-2-2v-9a2 2 0 0 1 2-2"></path><path d="M9 13a3 3 0 1 0 6 0a3 3 0 0 0-6 0"></path></svg><span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600; color: #2540D8">Add photos, a receipt or more</span><span class="m" style="font-size: 10px; font-weight: 500; letter-spacing: 0.3px; line-height: 1.3; color: rgba(7,18,56,0.55)">GOOD FOR ANYTHING YOU’D WANT TO PROVE LATER</span></span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="rgba(7,18,56,0.35)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M9 6l6 6l-6 6"></path></svg></a>
</div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const chips = (key, opts, cur) => opts.map(([k, l]) => ({ l, on: cur === k, pick: () => this.setState({ [key]: k }), style: 'height: 36px; padding: 0 12px; border-radius: 999px; font-size: 13.5px; font-weight: 600; box-sizing: border-box; ' + (cur === k ? 'background: #071238; color: #FFFFFF;' : 'border: 1px solid rgba(7,18,56,0.18); color: rgba(7,18,56,0.75);') }));
    const sw = (on) => 'width: 51px; height: 31px; border-radius: 999px; position: relative; flex-shrink: 0; transition: background .15s; background: ' + (on ? '#2540D8' : 'rgba(7,18,56,0.16)') + ';';
    const kn = (on) => 'position: absolute; top: 2px; left: ' + (on ? 22 : 2) + 'px; width: 27px; height: 27px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 2px 4px rgba(7,18,56,0.25); transition: left .15s;';

    const v = (k, d) => st[k] !== undefined ? st[k] : d;
    const out = { cost: v('cost', '$22.00'), note: v('note', ''), on_cost: (e) => this.setState({ cost: e.target.value }), on_note: (e) => this.setState({ note: e.target.value }) };
    out.whens = chips('when', [['today', 'Today'], ['yday', 'Yesterday'], ['pick', 'Pick a day']], v('when', 'today'));
    out.whos = chips('who', [['me', 'Me'], ['alex', 'Alex'], ['pro', 'A pro']], v('who', 'me'));
    out.costHelp = out.cost === '$22.00' ? 'FROM LAST TIME · CHANGE IT' : 'ADDS TO UPKEEP SPEND';
    out.ready = true; out.notReady = false;
    return out;
  }
}
</script>
</body>
</html>
