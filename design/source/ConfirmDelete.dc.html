<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Keystona ConfirmDelete</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.m{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;border:0;background:none;padding:0;margin:0;cursor:pointer;text-align:left}
a{color:#071238;text-decoration:none}a:hover{color:#2540D8}
@keyframes kpulse{0%{box-shadow:0 0 0 0 rgba(255,59,98,.5)}70%{box-shadow:0 0 0 6px rgba(255,59,98,0)}100%{box-shadow:0 0 0 0 rgba(255,59,98,0)}}
.pulse{animation:kpulse 1.8s infinite}
input,textarea{font:inherit;color:#071238}
input::placeholder,textarea::placeholder{color:rgba(7,18,56,0.35)}
input:focus,textarea:focus{outline:none}
textarea{resize:none}
select{appearance:none;-webkit-appearance:none;background:transparent;border:0;font:inherit;color:#071238}select:focus{outline:none}
input[type=time]::-webkit-calendar-picker-indicator{opacity:0.5}
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
@keyframes kspin{to{transform:rotate(360deg)}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; color: #071238; position: relative; overflow: hidden">
<div aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none"><dc-import name="ApplianceDetail" hint-size="390px,2430px"></dc-import></div>
<sc-if value="{{asking}}" hint-placeholder-val="{{ true }}">
<a href="ApplianceDetail.dc.html" aria-label="Cancel" style="position: absolute; inset: 0; background: rgba(7,18,56,0.5)"></a>
<section role="alertdialog" aria-label="Delete washer" style="position: absolute; left: 16px; right: 16px; top: 170px; background: #FFFFFF; border-radius: 24px; padding: 20px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 24px 60px rgba(7,18,56,0.35)">
<span style="width: 48px; height: 48px; border-radius: 50%; border: 1.5px solid #FF3B62; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FF3B62" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7l16 0"></path><path d="M10 11l0 6"></path><path d="M14 11l0 6"></path><path d="M5 7l1 12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2l1-12"></path><path d="M9 7v-3a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v3"></path></svg></span>
<span style="font-size: 22px; font-weight: 800; letter-spacing: -0.5px">Delete the washer?</span>
<span style="font-size: 14.5px; line-height: 1.5; color: rgba(7,18,56,0.7)">This also removes what&rsquo;s attached to it:</span>
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px"><li style="display: flex; align-items: flex-start; gap: 10px"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="rgba(7,18,56,0.6)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 12l5 5l10-10"></path><path d="M2 12l5 5m5-5l5-5"></path></svg><span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14.5px; font-weight: 600">2 reminders</span><span class="m" style="font-size: 10px; font-weight: 500; letter-spacing: 0.3px; line-height: 1.3; color: rgba(7,18,56,0.55)">CLEAN THE DRAIN PUMP, CHECK HOSES</span></span></li><li style="display: flex; align-items: flex-start; gap: 10px"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="rgba(7,18,56,0.6)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 7h1a2 2 0 0 0 2-2a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1a2 2 0 0 0 2 2h1a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-14a2 2 0 0 1-2-2v-9a2 2 0 0 1 2-2"></path><path d="M9 13a3 3 0 1 0 6 0a3 3 0 0 0-6 0"></path></svg><span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14.5px; font-weight: 600">3 photos</span><span class="m" style="font-size: 10px; font-weight: 500; letter-spacing: 0.3px; line-height: 1.3; color: rgba(7,18,56,0.55)">LABEL, HOOKUPS, INSTALL</span></span></li><li style="display: flex; align-items: flex-start; gap: 10px"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="rgba(7,18,56,0.6)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 12m-9 0a9 9 0 1 0 18 0a9 9 0 1 0-18 0"></path><path d="M12 7v5l3 3"></path></svg><span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14.5px; font-weight: 600">Service history</span><span class="m" style="font-size: 10px; font-weight: 500; letter-spacing: 0.3px; line-height: 1.3; color: rgba(7,18,56,0.55)">1 REPAIR · $140</span></span></li></ul>
<div style="display: flex; flex-direction: column; gap: 8px; padding: 12px; border-radius: 14px; border: 1px solid rgba(7,18,56,0.12)">
<span style="font-size: 14px; font-weight: 700">The warranty document</span>
<div role="radiogroup" style="display: grid; grid-template-columns: 1fr 1fr; gap: 6px"><sc-for list="{{docOpts}}" as="o" hint-placeholder-count="2"><button type="button" role="radio" aria-checked="{{o.on}}" onClick="{{o.pick}}" style="{{o.style}}">{{o.l}}</button></sc-for></div>
<span class="m" style="font-size: 10px; font-weight: 500; letter-spacing: 0.3px; line-height: 1.35; color: rgba(7,18,56,0.45)">{{docHelp}}</span>
</div>
<div style="display: flex; gap: 8px; padding-top: 2px">
<a href="ApplianceDetail.dc.html" style="flex: 1; height: 50px; border-radius: 999px; border: 1.5px solid rgba(7,18,56,0.2); box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600">Cancel</a>
<button type="button" onClick="{{del}}" style="flex: 1.3; height: 50px; border-radius: 999px; background: #FF3B62; color: #FFFFFF; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center">Delete washer</button>
</div>
</section>
</sc-if>
<sc-if value="{{done}}" hint-placeholder-val="{{ false }}">
<div aria-hidden="true" style="position: absolute; inset: 0; background: #FFFFFF; pointer-events: none"><dc-import name="HomeAppliances" hint-size="390px,1060px"></dc-import></div>
<div role="status" style="position: absolute; left: 12px; right: 12px; bottom: 104px; display: flex; align-items: center; gap: 12px; padding: 12px 8px 12px 16px; border-radius: 16px; background: #071238; color: #FFFFFF; box-shadow: 0 12px 30px rgba(7,18,56,0.3)">
<span style="flex: 1; display: flex; flex-direction: column; gap: 3px"><span style="font-size: 14.5px; font-weight: 700">Washer deleted</span><span style="font-size: 12.5px; color: rgba(255,255,255,0.7)">{{toastSub}}</span></span>
<button type="button" onClick="{{undo}}" style="min-width: 64px; height: 44px; border-radius: 12px; font-size: 15px; font-weight: 700; color: #ECF87F">Undo</button>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const keep = st.keep !== undefined ? st.keep : true;
    const done = !!st.done;
    return {
      asking: !done, done,
      docOpts: [[true, 'Keep it in Docs'], [false, 'Delete it too']].map(([k, l]) => ({ l, on: keep === k, pick: () => this.setState({ keep: k }),
        style: 'height: 40px; border-radius: 10px; font-size: 13.5px; font-weight: 600; display: flex; align-items: center; justify-content: center; ' + (keep === k ? (k ? 'background: #071238; color: #FFFFFF;' : 'background: #FF3B62; color: #FFFFFF;') : 'box-shadow: inset 0 0 0 1px rgba(7,18,56,0.16); color: rgba(7,18,56,0.65);') })),
      docHelp: keep ? 'IT STAYS IN DOCS, NO LONGER LINKED TO AN APPLIANCE' : 'GONE FROM DOCS TOO · COUNTS BACK TOWARD YOUR 50',
      del: () => this.setState({ done: true }), undo: () => this.setState({ done: false }),
      toastSub: keep ? 'Warranty kept in Docs. Undo within 10 seconds.' : 'Warranty deleted too. Undo within 10 seconds.'
    };
  }
}
</script>
</body>
</html>
