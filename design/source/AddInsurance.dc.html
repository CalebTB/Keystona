<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Keystona AddInsurance</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.m{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;border:0;background:none;padding:0;margin:0;cursor:pointer;text-align:left}
a{color:#071238;text-decoration:none}a:hover{color:#2540D8}
@keyframes kpulse{0%{box-shadow:0 0 0 0 rgba(255,59,98,.5)}70%{box-shadow:0 0 0 6px rgba(255,59,98,0)}100%{box-shadow:0 0 0 0 rgba(255,59,98,0)}}
.pulse{animation:kpulse 1.8s infinite}
input,textarea{font:inherit;color:#071238}
input::placeholder,textarea::placeholder{color:rgba(7,18,56,0.35)}
input:focus,textarea:focus{outline:none}
textarea{resize:none}
select{appearance:none;-webkit-appearance:none;background:transparent;border:0;font:inherit;color:#071238}select:focus{outline:none}
input[type=time]::-webkit-calendar-picker-indicator{opacity:0.5}
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
textarea{font:inherit;color:#071238;resize:none}textarea:focus{outline:none}textarea::placeholder{color:rgba(7,18,56,0.35)}input::placeholder{color:rgba(7,18,56,0.35)}.sb>*{flex-shrink:0}
</style>
</helmet>
<div style="width: 390px; height: 1100px; box-sizing: border-box; background: #FFFFFF; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; color: #071238; position: relative; overflow: hidden">
<div aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none"><dc-import name="InsuranceList" hint-size="390px,1340px"></dc-import></div>
<a href="InsuranceList.dc.html" aria-label="Close" style="position: absolute; inset: 0; background: rgba(7,18,56,0.45)"></a>
<section role="dialog" aria-label="Add a policy" style="position: absolute; left: 0; right: 0; top: 56px; bottom: 0; background: #FFFFFF; border-radius: 22px 22px 0 0; display: flex; flex-direction: column">
<span aria-hidden="true" style="align-self: center; margin-top: 8px; width: 36px; height: 4px; border-radius: 3px; background: rgba(7,18,56,0.2)"></span>
<div style="display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; padding: 6px 16px 10px; border-bottom: 0.5px solid rgba(7,18,56,0.12)">
<a href="InsuranceList.dc.html" style="justify-self: start; display: flex; align-items: center; min-height: 44px; font-size: 15px; font-weight: 500; color: rgba(7,18,56,0.6)">Cancel</a>
<h1 style="margin: 0; font-size: 16px; font-weight: 700">Add a policy</h1>
<span style="justify-self: end"><sc-if value="{{ready}}" hint-placeholder-val="{{ false }}"><a href="InsuranceList.dc.html" style="display: flex; align-items: center; height: 36px; padding: 0 16px; border-radius: 999px; background: #2540D8; color: #FFFFFF; font-size: 14px; font-weight: 600">Save</a></sc-if><sc-if value="{{notReady}}" hint-placeholder-val="{{ true }}"><span aria-disabled="true" style="display: flex; align-items: center; height: 36px; padding: 0 16px; border-radius: 999px; background: rgba(7,18,56,0.08); color: rgba(7,18,56,0.35); font-size: 14px; font-weight: 600">Save</span></sc-if></span>
</div>
<div class="sb" style="flex: 1; min-height: 0; overflow-y: auto; padding: 16px 16px 30px; display: flex; flex-direction: column; gap: 20px">
<button type="button" onClick="{{scan}}" style="{{scanBox}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FF3B62" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7v-1a2 2 0 0 1 2-2h2"></path><path d="M4 17v1a2 2 0 0 0 2 2h2"></path><path d="M16 4h2a2 2 0 0 1 2 2v1"></path><path d="M16 20h2a2 2 0 0 0 2-2v-1"></path><path d="M5 12h14"></path></svg><span style="flex: 1; display: flex; flex-direction: column; gap: 3px; text-align: left"><span style="font-size: 15px; font-weight: 700">{{scanTitle}}</span><span style="font-size: 13px; line-height: 1.4; color: rgba(7,18,56,0.6)">{{scanSub}}</span></span><span class="m" style="display: inline-flex; align-items: center; gap: 4px; padding: 2px 7px; border-radius: 999px; font-size: 9px; font-weight: 700; letter-spacing: 0.8px; white-space: nowrap; background: #FF3B62; color: #FFFFFF;">★ PREMIUM</span></button>
<div style="display: flex; flex-direction: column; gap: 8px"><span class="m" style="font-size: 10px; font-weight: 500; letter-spacing: 1.2px; color: rgba(7,18,56,0.55)">KIND OF POLICY</span><div role="radiogroup" style="display: flex; gap: 6px; flex-wrap: wrap"><sc-for list="{{types}}" as="c" hint-placeholder-count="6"><button type="button" role="radio" aria-checked="{{c.on}}" onClick="{{c.pick}}" style="{{c.style}}">{{c.l}}</button></sc-for></div></div>
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="display: flex; align-items: center; gap: 3px; min-height: 13px"><span class="m" style="font-size: 10px; font-weight: 500; letter-spacing: 1.2px; color: rgba(7,18,56,0.55)">COMPANY</span><span aria-hidden="true" style="color: #FF3B62; font-weight: 700">*</span></span>
<input type="text" inputmode="text" value="{{carrier}}" onChange="{{on_carrier}}" placeholder="e.g. Statewide Mutual"  style="width: 100%; height: 50px; padding: 0 14px; font-size: 16px; border: 1px solid rgba(7,18,56,0.18); border-radius: 12px; box-sizing: border-box">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="display: flex; align-items: center; gap: 3px; min-height: 13px"><span class="m" style="font-size: 10px; font-weight: 500; letter-spacing: 1.2px; color: rgba(7,18,56,0.55)">POLICY NUMBER</span><span aria-hidden="true" style="color: #FF3B62; font-weight: 700">*</span></span>
<input type="text" inputmode="text" value="{{num}}" onChange="{{on_num}}" placeholder="On your declarations page"  style="width: 100%; height: 50px; padding: 0 14px; font-size: 16px; border: 1px solid rgba(7,18,56,0.18); border-radius: 12px; box-sizing: border-box">
</div>
<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px"><div style="display: flex; flex-direction: column; gap: 6px">
<span style="display: flex; align-items: center; gap: 3px; min-height: 13px"><span class="m" style="font-size: 10px; font-weight: 500; letter-spacing: 1.2px; color: rgba(7,18,56,0.55)">COVERAGE</span></span>
<input type="text" inputmode="numeric" value="{{cov}}" onChange="{{on_cov}}" placeholder="$"  style="width: 100%; height: 50px; padding: 0 14px; font-size: 16px; border: 1px solid rgba(7,18,56,0.18); border-radius: 12px; box-sizing: border-box">
</div><div style="display: flex; flex-direction: column; gap: 6px">
<span style="display: flex; align-items: center; gap: 3px; min-height: 13px"><span class="m" style="font-size: 10px; font-weight: 500; letter-spacing: 1.2px; color: rgba(7,18,56,0.55)">DEDUCTIBLE</span></span>
<input type="text" inputmode="numeric" value="{{ded}}" onChange="{{on_ded}}" placeholder="$"  style="width: 100%; height: 50px; padding: 0 14px; font-size: 16px; border: 1px solid rgba(7,18,56,0.18); border-radius: 12px; box-sizing: border-box">
</div></div>
<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px"><div style="display: flex; flex-direction: column; gap: 6px">
<span style="display: flex; align-items: center; gap: 3px; min-height: 13px"><span class="m" style="font-size: 10px; font-weight: 500; letter-spacing: 1.2px; color: rgba(7,18,56,0.55)">PREMIUM</span></span>
<input type="text" inputmode="numeric" value="{{prem}}" onChange="{{on_prem}}" placeholder="$"  style="width: 100%; height: 50px; padding: 0 14px; font-size: 16px; border: 1px solid rgba(7,18,56,0.18); border-radius: 12px; box-sizing: border-box">
</div><div style="display: flex; flex-direction: column; gap: 6px"><span class="m" style="font-size: 10px; font-weight: 500; letter-spacing: 1.2px; color: rgba(7,18,56,0.55)">PAID</span><div role="radiogroup" style="display: flex; gap: 6px; flex-wrap: wrap"><sc-for list="{{freq}}" as="c" hint-placeholder-count="6"><button type="button" role="radio" aria-checked="{{c.on}}" onClick="{{c.pick}}" style="{{c.style}}">{{c.l}}</button></sc-for></div></div></div>
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="display: flex; align-items: center; gap: 3px; min-height: 13px"><span class="m" style="font-size: 10px; font-weight: 500; letter-spacing: 1.2px; color: rgba(7,18,56,0.55)">RENEWS ON</span><span aria-hidden="true" style="color: #FF3B62; font-weight: 700">*</span></span>
<input type="text" inputmode="text" value="{{renew}}" onChange="{{on_renew}}" placeholder="MM / DD / YYYY"  style="width: 100%; height: 50px; padding: 0 14px; font-size: 16px; border: 1px solid rgba(7,18,56,0.18); border-radius: 12px; box-sizing: border-box">
<span class="m" style="font-size: 10px; font-weight: 500; letter-spacing: 0.3px; line-height: 1.35; color: rgba(7,18,56,0.45)">{{renewHelp}}</span></div>
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="display: flex; align-items: center; gap: 3px; min-height: 13px"><span class="m" style="font-size: 10px; font-weight: 500; letter-spacing: 1.2px; color: rgba(7,18,56,0.55)">CLAIMS PHONE</span></span>
<input type="text" inputmode="tel" value="{{claims}}" onChange="{{on_claims}}" placeholder="Shows a call button in Emergency"  style="width: 100%; height: 50px; padding: 0 14px; font-size: 16px; border: 1px solid rgba(7,18,56,0.18); border-radius: 12px; box-sizing: border-box">
</div>
<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px"><div style="display: flex; flex-direction: column; gap: 6px">
<span style="display: flex; align-items: center; gap: 3px; min-height: 13px"><span class="m" style="font-size: 10px; font-weight: 500; letter-spacing: 1.2px; color: rgba(7,18,56,0.55)">AGENT</span></span>
<input type="text" inputmode="text" value="{{agent}}" onChange="{{on_agent}}" placeholder="Optional"  style="width: 100%; height: 50px; padding: 0 14px; font-size: 16px; border: 1px solid rgba(7,18,56,0.18); border-radius: 12px; box-sizing: border-box">
</div><div style="display: flex; flex-direction: column; gap: 6px">
<span style="display: flex; align-items: center; gap: 3px; min-height: 13px"><span class="m" style="font-size: 10px; font-weight: 500; letter-spacing: 1.2px; color: rgba(7,18,56,0.55)">AGENT PHONE</span></span>
<input type="text" inputmode="tel" value="{{aphone}}" onChange="{{on_aphone}}" placeholder="Optional"  style="width: 100%; height: 50px; padding: 0 14px; font-size: 16px; border: 1px solid rgba(7,18,56,0.18); border-radius: 12px; box-sizing: border-box">
</div></div>
<div style="display: flex; flex-direction: column; gap: 8px"><span class="m" style="font-size: 10px; font-weight: 500; letter-spacing: 1.2px; color: rgba(7,18,56,0.55)">REMIND ME BEFORE IT RENEWS</span><div role="radiogroup" style="display: flex; gap: 6px; flex-wrap: wrap"><sc-for list="{{rem}}" as="c" hint-placeholder-count="6"><button type="button" role="radio" aria-checked="{{c.on}}" onClick="{{c.pick}}" style="{{c.style}}">{{c.l}}</button></sc-for></div></div>
</div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1100}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const chips = (key, opts, cur) => opts.map(([k, l]) => ({ l, on: cur === k, pick: () => this.setState({ [key]: k }), style: 'height: 36px; padding: 0 12px; border-radius: 999px; font-size: 13.5px; font-weight: 600; box-sizing: border-box; ' + (cur === k ? 'background: #071238; color: #FFFFFF;' : 'border: 1px solid rgba(7,18,56,0.18); color: rgba(7,18,56,0.75);') }));
    const sw = (on) => 'width: 51px; height: 31px; border-radius: 999px; position: relative; flex-shrink: 0; transition: background .15s; background: ' + (on ? '#2540D8' : 'rgba(7,18,56,0.16)') + ';';
    const kn = (on) => 'position: absolute; top: 2px; left: ' + (on ? 22 : 2) + 'px; width: 27px; height: 27px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 2px 4px rgba(7,18,56,0.25); transition: left .15s;';

    const v = (k, d) => st[k] !== undefined ? st[k] : d;
    const out = {};
    const D = { carrier: '', num: '', cov: '', ded: '', prem: '', renew: '', claims: '', agent: '', aphone: '' };
    const scanned = !!st.scanned;
    const S = { carrier: 'Statewide Mutual', num: 'FL-0912-334', cov: '$250,000', ded: '$1,250', prem: '$412', renew: '04 / 18 / 2027', claims: '(800) 555-0123' };
    Object.keys(D).forEach((k) => { out[k] = v(k, scanned && S[k] ? S[k] : D[k]); out['on_' + k] = (e) => this.setState({ [k]: e.target.value }); });
    out.scan = () => this.setState({ scanned: true, type: 'flood' });
    out.scanTitle = scanned ? 'Filled in from your scan' : 'Scan the declarations page';
    out.scanSub = scanned ? 'Check each field — tap any to fix it.' : 'We’ll fill in the company, policy number, dates and amounts.';
    out.scanBox = 'display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 16px; box-sizing: border-box; ' + (scanned ? 'border: 1.5px solid #4A6604;' : 'border: 1.5px solid #FF3B62;');
    out.types = chips('type', [['home', 'Homeowners'], ['flood', 'Flood'], ['umbrella', 'Umbrella'], ['warranty', 'Home warranty'], ['quake', 'Earthquake'], ['other', 'Other']], v('type', 'flood'));
    out.freq = chips('freq', [['yr', 'Yearly'], ['mo', 'Monthly']], v('freq', 'yr'));
    out.rem = chips('rem', [['60', '60 days'], ['30', '30 days'], ['14', '2 weeks']], v('rem', '30'));
    const r = out.renew.replace(/\s/g, ''); const rOk = /^\d{2}\/\d{2}\/\d{4}$/.test(r);
    out.renewHelp = !r ? 'WE’LL REMIND YOU TO SHOP AROUND BEFORE THIS DATE' : (rOk ? 'REMINDER SET FOR 30 DAYS BEFORE' : 'USE MM / DD / YYYY');
    out.ready = !!out.carrier.trim() && !!out.num.trim() && rOk; out.notReady = !out.ready;
    return out;
  }
}
</script>
</body>
</html>
