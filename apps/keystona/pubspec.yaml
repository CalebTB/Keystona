name: keystona
description: "Keystona — The smart way to manage your home."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # ─── Supabase ───────────────────
  supabase_flutter: ^2.5.0

  # ─── State Management ──────────
  flutter_riverpod: ^3.1.0
  riverpod_annotation: ^4.0.0

  # ─── Navigation ─────────────────
  go_router: ^17.1.0

  # ─── UI Components ─────────────
  google_fonts: ^8.0.2
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  pdfx: ^2.9.2
  photo_view: ^0.15.0

  # ─── Local Storage & Offline ───
  shared_preferences: ^2.2.0
  path_provider: ^2.1.0

  # ─── File & Camera ─────────────
  image_picker: ^1.1.0
  file_picker: ^10.3.10
  flutter_image_compress: ^2.3.0

  # ─── Notifications ─────────────
  firebase_core: ^4.4.0
  firebase_messaging: ^16.1.1
  flutter_local_notifications: ^20.1.0

  # ─── Analytics & Monitoring ────
  posthog_flutter: ^5.15.2
  sentry_flutter: ^9.14.0

  # ─── Payments ──────────────────
  purchases_flutter: ^9.12.3
  purchases_ui_flutter: ^9.12.3

  # ─── Utilities ─────────────────
  intl: any
  url_launcher: ^6.2.0
  share_plus: ^12.0.1
  connectivity_plus: ^7.0.0
  permission_handler: ^12.0.1
  uuid: ^4.4.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.0
  riverpod_generator: ^4.0.0+1
  freezed: ^3.2.3
  json_serializable: ^6.8.0
  mockito: ^5.4.0
  sentry_dart_plugin: ^3.4.0

dependency_overrides:
  # Workaround: path_provider_foundation 2.6.0 uses objective_c FFI which
  # can't find objective_c.framework in the iOS 26.2 simulator runtime.
  # 2.4.3 uses MethodChannel instead of FFI and avoids the crash.
  # Remove once path_provider_foundation ships a fix for iOS 26 simulators.
  path_provider_foundation: 2.4.3

flutter:
  uses-material-design: true

# ─── Sentry debug symbol upload (sentry_dart_plugin 3.4.0) ───────────────────
# Run `dart run sentry_dart_plugin` AFTER a release build — the build writes the
# symbols, the plugin uploads them. The Makefile release targets do this.
#
# Key names verified against the installed plugin's configuration_values.dart.
# `upload_native_symbols` / `include_native_sources` are the deprecated spellings;
# a misspelled key is silently ignored rather than reported.
#
# auth_token is deliberately ABSENT. This file is committed, so the token comes
# from the SENTRY_AUTH_TOKEN environment variable instead.
sentry:
  org: caleb-byers
  project: keystona

  # Native debug files: iOS dSYM and Android symbols. Needed for native crashes
  # whether or not Dart code is obfuscated, since the Dart obfuscation map does
  # not symbolicate a native frame.
  upload_debug_symbols: true

  # Uploads source files so Sentry can show the offending line inline.
  # This sends application source to Sentry — fine for a private project, and
  # it is the difference between a line number and seeing the actual code.
  upload_sources: true

  # Web-only; this app targets iOS and Android.
  upload_source_maps: false

  # Commit integration is OFF. `set-commits --auto` needs a Sentry<->GitHub
  # integration installed at the ORG level with this repo linked; without one
  # the call returns 403 and fails the build *after* symbols have already
  # uploaded successfully — all the work done, exit code 1. Turn this back on
  # (delete the line) once the GitHub integration is connected in Sentry, which
  # buys suspect-commit attribution on new issues.
  commits: false


  # Fail the upload step loudly rather than silently skipping absent artifacts.
  ignore_missing: false
